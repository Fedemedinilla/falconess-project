<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const POS_COL = { lead: "#4d8dff", pack: "#2fd08a", stalk: "#ffb02e", closer: "#a77bff" };
const POS_GLYPH = { lead: "▲", pack: "■", stalk: "◆", closer: "▼" };
const STYLE_NAME = { lance: "Lanza", column: "Columna", ramp: "Rampa", turbine: "Turbina", neutral: "Neutra" };
const BAND_NAME = ["SUELO", "BAJA", "ALTA", "TECHO"];
const SEG_NAME = { flat: "", curves: "Curvas", climb: "Colina", descent: "Bajada", jump: "Salto", water: "Líquido", canyon: "Pasillo" };
const SEG_COL = { flat: "#1a2232", curves: "#3a2c18", climb: "#3b2a1f", descent: "#1f2f3b", jump: "#4a1f2a", water: "#123a4a", canyon: "#2b2440" };
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const kmh = (mms) => Math.round((mms * 3.6) / 1000);
const metres = (mm) => (mm / 1000).toFixed(1).replace(".", ",");

// ---- per race: timelines read from the log -------------------------------------------------------
function prep(r) {
  const L = r.log;
  const n = L.entries.length;
  const ev = L.events;
  const lanes = [];
  for (let i = 0; i < n; i++) lanes.push({ kf: [], dives: [], moments: [], flights: [] });
  // altitude keyframes: takeoff (fromBand), each bandReached, a knock, diveStart (fromBand), touchdown (0)
  for (const e of ev) {
    const ln = lanes[e.lane];
    if (!ln) continue;
    if (e.kind === "takeoff") { ln.kf.push([e.tick, e.fromBand]); ln.flights.push({ t0: e.tick, style: e.style, posMm: e.posMm, band: e.band }); }
    else if (e.kind === "bandReached") ln.kf.push([e.tick, e.band]);
    else if (e.kind === "lineChange" && e.cause === "knock") { ln.kf.push([e.tick, e.fromBand]); ln.kf.push([e.tick + 3, e.toBand]); }
    else if (e.kind === "lineChange" && e.cause === "over") ln.kf.push([e.tick, e.fromBand]);
    else if (e.kind === "diveStart") { ln.kf.push([e.tick, e.fromBand]); ln.dives.push({ t0: e.tick, v0: e.vMms, from: e.fromBand, t1: null, d: null }); }
    else if (e.kind === "touchdown") { ln.kf.push([e.tick, 0]); const dv = ln.dives[ln.dives.length - 1]; if (dv && dv.t1 === null) dv.t1 = e.tick; }
    else if (e.kind === "dive") { const dv = ln.dives[ln.dives.length - 1]; if (dv) dv.d = e; }
  }
  for (const ln of lanes) ln.kf.sort((a, b) => a[0] - b[0]);
  return { L, lanes };
}

function frameRow(L, t) {
  const tk = L.frames.tick;
  let lo = 0, hi = tk.length - 1;
  if (t <= tk[0]) return [0, 0, 0];
  if (t >= tk[hi]) return [hi, hi, 0];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tk[m] <= t) lo = m; else hi = m; }
  return [lo, hi, (t - tk[lo]) / (tk[hi] - tk[lo])];
}
function colAt(L, lane, col, t) {
  const [a, b, f] = frameRow(L, t);
  const c = L.frames.runners[lane][col];
  return c[a] + (c[b] - c[a]) * f;
}
function flagAt(L, lane, t) {
  const [a] = frameRow(L, t);
  return L.frames.runners[lane].flags[a];
}
/** Altitude (bands, fractional) from the flight keyframes; between flights the frame flags (jumps). */
function altAt(P, lane, t) {
  const kf = P.lanes[lane].kf;
  for (let k = 0; k < kf.length - 1; k++) {
    const [t0, b0] = kf[k], [t1, b1] = kf[k + 1];
    if (t >= t0 && t <= t1) {
      if (b0 === 0 && b1 === 0) break;
      return t1 === t0 ? b1 : b0 + (b1 - b0) * ((t - t0) / (t1 - t0));
    }
  }
  const f = flagAt(P.L, lane, t);
  return (f & 32768 ? 1 : 0) + (f & 65536 ? 2 : 0);
}
/** Body speed: frames, but inside a dive the log's numbers (diveStart → air share → peak → decay). */
function speedAt(P, lane, t) {
  for (const dv of P.lanes[lane].dives) {
    if (dv.t1 === null) continue;
    if (t >= dv.t0 && t < dv.t1) {
      const air = dv.d && dv.d.airMms ? dv.d.airMms : 0;
      return dv.v0 + air * ((t - dv.t0) / Math.max(1, dv.t1 - dv.t0));
    }
    if (dv.d && t >= dv.t1 && t <= dv.t1 + dv.d.surgeTicks) {
      const k = (t - dv.t1) / Math.max(1, dv.d.surgeTicks);
      return dv.d.vBeforeMms + dv.d.gainMms * (1 - k);
    }
  }
  return colAt(P.L, lane, "vMms", t);
}
function rankAt(P, lane, t) {
  const me = colAt(P.L, lane, "posMm", t);
  let r = 1;
  for (let j = 0; j < P.L.entries.length; j++) if (j !== lane && colAt(P.L, j, "posMm", t) > me) r++;
  return r;
}

// ---- the moments of the followed runner: banners and chips, each number from its event ----------
function momentsOf(P, lane) {
  const out = [];
  const ev = P.L.events;
  for (const e of ev) {
    if (e.lane !== lane) continue;
    if (e.kind === "takeoff" && e.fromBand === 0) {
      out.push({ t: e.tick, kind: "banner", cls: e.style === "turbine" ? "gold" : "cyan", text: `DESPEGUE · ${STYLE_NAME[e.style] || e.style}`, src: e });
      out.push({ t: e.tick, kind: "chip", cls: "down", text: `−${Math.round(e.cost / 1000)} energía`, src: e, num: Math.round(e.cost / 1000), field: "cost/1000" });
    } else if (e.kind === "bandReached") out.push({ t: e.tick, kind: "chip", cls: "cyan", text: BAND_NAME[e.band], src: e });
    else if (e.kind === "lineChange") out.push({ t: e.tick, kind: "banner", cls: e.cause === "over" ? "green" : "red", text: e.cause === "over" ? "¡POR ARRIBA!" : "LA BAJARON", src: e });
    else if (e.kind === "airDirty" && e.on) out.push({ t: e.tick, kind: "chip", cls: "down", text: "AIRE SUCIO", src: e });
    else if (e.kind === "diveStart" && e.cause === "plan" && e.fromBand >= 2) out.push({ t: e.tick, kind: "banner", cls: e.fromBand === 3 ? "" : "cyan", text: e.fromBand === 3 ? "GRAN PICADA" : "PICADA", src: e });
    else if (e.kind === "nerve") out.push({ t: e.tick, kind: "banner", cls: e.held ? "gold" : "red", text: e.held ? "¡NO SE ACHICA!" : "SE ACHICÓ", src: e });
    else if (e.kind === "dive") {
      out.push({ t: e.tick, kind: "chip", cls: "gold", text: `${kmh(e.vBeforeMms + e.gainMms)} km/h`, src: e, num: kmh(e.vBeforeMms + e.gainMms), field: "kmh(vBeforeMms+gainMms)" });
      const ds = ev.find((x) => x.kind === "diveStart" && x.lane === lane && x.tick < e.tick && x.tick >= e.tick - 20);
      const r0 = rankAt(P, lane, ds ? ds.tick : e.tick);
      const r1 = rankAt(P, lane, Math.min(e.tick + 45, P.L.ticks));
      if (r0 - r1 >= 1) out.push({ t: e.tick + 45, kind: "chip", cls: "up", text: `+${r0 - r1} PUESTO${r0 - r1 > 1 ? "S" : ""}`, src: e, num: r0 - r1, field: "rank(diveStart) − rank(touchdown + 3 s)" });
      else out.push({ t: e.tick + 8, kind: "chip", cls: "gold", text: `impulso +${metres(e.surgeMm)} m`, src: e, num: Number(metres(e.surgeMm).replace(",", ".")), field: "surgeMm/1000" });
    } else if (e.kind === "touchdown" && e.lossMms > 0) out.push({ t: e.tick, kind: "chip", cls: "down", text: `−${kmh(e.lossMms)} km/h`, src: e, num: kmh(e.lossMms), field: "kmh(lossMms)" });
    else if (e.kind === "pass" && e.band >= 1) out.push({ t: e.tick, kind: "chip", cls: "up", text: "PASÓ EN EL AIRE", src: e });
    else if (e.kind === "noLift") out.push({ t: e.tick, kind: "banner", cls: "red", text: "SIN ENERGÍA", src: e });
  }
  return out.sort((a, b) => a.t - b.t);
}

// ---- state ---------------------------------------------------------------------------------------
const races = D.races.map((r) => ({ ...r, P: prep(r) }));
let R = races[0], lane = R.follow, tick = 0, playing = false, speed = 1, moments = momentsOf(R.P, lane);
const trails = new Map();
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const elBanners = document.getElementById("banners");
const elChips = document.getElementById("chips");
const tl = document.getElementById("tl");

function layout() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ground = h - 46;
  const bandPx = Math.max(18, Math.min(64, (ground - 40) / 3.4));
  return { w, h, ground, bandPx, mPerPx: 90 / w };
}
let LY = layout();

function setRace(k) {
  R = races[k]; lane = R.follow; tick = 0; trails.clear(); moments = momentsOf(R.P, lane);
  document.querySelectorAll("#races button").forEach((b, i) => b.setAttribute("aria-selected", String(i === k)));
  const sel = document.getElementById("follow");
  sel.innerHTML = "";
  R.log.entries.forEach((e) => { const o = document.createElement("option"); o.value = e.lane; o.textContent = `${POS_GLYPH[e.position]} carril ${e.lane + 1} · ${e.label}`; sel.appendChild(o); });
  sel.value = lane;
  document.getElementById("rtitle").textContent = `${R.title} · semilla ${R.log.seed}`;
  tl.max = R.log.ticks;
  render();
}

// ---- drawing -------------------------------------------------------------------------------------
function yOf(alt) { return LY.ground - alt * LY.bandPx; }
function glyph(x, y, pos, s, me) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = POS_COL[pos]; ctx.strokeStyle = me ? "#fff" : "rgba(0,0,0,.6)"; ctx.lineWidth = me ? 2.5 : 1.2;
  ctx.beginPath();
  if (pos === "lead") { ctx.moveTo(0, -s); ctx.lineTo(s, s * .8); ctx.lineTo(-s, s * .8); }
  else if (pos === "pack") ctx.rect(-s * .8, -s * .8, s * 1.6, s * 1.6);
  else if (pos === "stalk") { ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0); }
  else { ctx.moveTo(-s, -s * .8); ctx.lineTo(s, -s * .8); ctx.lineTo(0, s); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function render() {
  const { w, h, ground, bandPx, mPerPx } = LY;
  const L = R.log, P = R.P, t = tick;
  const camMm = colAt(L, lane, "posMm", t);
  const xOf = (mm) => w * 0.42 + (mm - camMm) / 1000 / mPerPx;
  let shake = 0;
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#0b1020"); g.addColorStop(1, "#05070c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // impact shake (the last touchdown of the followed runner, 150 ms)
  for (const dv of P.lanes[lane].dives) if (dv.t1 !== null && dv.d && t >= dv.t1 && t < dv.t1 + 3 && !reduce) shake = 4;
  ctx.save();
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  // bands
  for (let b = 1; b <= 3; b++) {
    const y = yOf(b);
    ctx.strokeStyle = b === 3 ? "rgba(143,91,255,.45)" : "rgba(255,255,255,.12)"; ctx.setLineDash([4, 6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(180,191,208,.75)"; ctx.font = "700 11px Barlow Condensed, sans-serif"; ctx.fillText(BAND_NAME[b], 6, y - 4);
  }
  // ground and track features (abstract, ADR-0007)
  for (const s of L.geometry.segments) {
    const a = xOf(s.startMm), b = xOf(s.endMm);
    if (b < 0 || a > w) continue;
    ctx.fillStyle = SEG_COL[s.type] || "#1a2232"; ctx.fillRect(a, ground, b - a, 46);
    if (SEG_NAME[s.type]) { ctx.fillStyle = "rgba(244,247,251,.8)"; ctx.font = "700 12px Barlow Condensed, sans-serif"; ctx.fillText(SEG_NAME[s.type].toUpperCase(), Math.max(a + 4, 4), ground + 30); }
  }
  ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.fillRect(0, ground, w, 2);
  for (let m = Math.floor((camMm / 1000 - 60) / 10) * 10; m < camMm / 1000 + 60; m += 10) { const x = xOf(m * 1000); ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(x, ground + 2, 1, m % 50 === 0 ? 10 : 5); }
  const fin = xOf(L.geometry.lengthMm);
  if (fin > 0 && fin < w) { ctx.fillStyle = "#fff"; ctx.fillRect(fin - 2, ground - 3 * bandPx - 8, 4, 3 * bandPx + 8); }
  // runners, trails, style gestures
  const order = L.entries.map((e) => e.lane).sort((a, b) => (a === lane) - (b === lane));
  for (const i of order) {
    const e = L.entries[i];
    const pos = colAt(L, i, "posMm", t);
    const alt = altAt(P, i, t);
    const x = xOf(pos), y = yOf(alt) - 9;
    const tr = trails.get(i) || [];
    tr.push([pos, alt, t]); while (tr.length > 0 && t - tr[0][2] > 28) tr.shift(); trails.set(i, tr);
    if (alt > 0.05) {
      // trail: violet condensation on the ceiling, white elsewhere, red while diving
      const diving = P.lanes[i].dives.some((dv) => dv.t1 !== null && t >= dv.t0 && t <= dv.t1);
      ctx.strokeStyle = diving ? "rgba(255,84,104,.8)" : alt > 2.5 ? "rgba(143,91,255,.7)" : "rgba(255,255,255,.35)";
      ctx.lineWidth = i === lane ? 3 : 1.5;
      ctx.beginPath(); tr.forEach(([p, a], k) => { const xx = xOf(p), yy = yOf(a) - 9; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }); ctx.stroke();
      // shadow on the track, further per band
      ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.beginPath(); ctx.ellipse(x + alt * 6, ground - 1, 7, 2.5, 0, 0, 7); ctx.fill();
    }
    // the climb gesture of her style, from the takeoff event to the band she reaches
    const fl = P.lanes[i].flights.filter((f) => t >= f.t0 && t <= f.t0 + 30).pop();
    if (fl && !reduce) {
      const k = (t - fl.t0) / 30;
      ctx.save(); ctx.globalAlpha = 1 - k;
      if (fl.style === "lance") { ctx.strokeStyle = "#35e0ff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(xOf(fl.posMm), ground - 2, 6 + 20 * k, 3 + 6 * k, 0, 0, 7); ctx.stroke(); }
      else if (fl.style === "column") { ctx.strokeStyle = "#ffb02e"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 10, y + 8); ctx.lineTo(x, y - 6); ctx.lineTo(x + 10, y + 8); ctx.stroke(); }
      else if (fl.style === "ramp") { ctx.strokeStyle = "rgba(77,141,255,.8)"; ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xOf(fl.posMm), ground - 2); ctx.lineTo(xOf(fl.posMm) + 38 / mPerPx, yOf(fl.band) - 9); ctx.stroke(); ctx.setLineDash([]); }
      else if (fl.style === "turbine") { ctx.fillStyle = "#ff7a2e"; for (let q = 0; q < 6; q++) { ctx.beginPath(); ctx.arc(x - 8 - q * 5, y + 10 + (q % 2) * 2, 3 - q * .4, 0, 7); ctx.fill(); } }
      ctx.restore();
    }
    // Turbina skim: low flame under the frame while she skims
    if (e.style === "ground" && alt > 0.5 && !reduce) { ctx.fillStyle = "rgba(255,122,46,.85)"; ctx.beginPath(); ctx.moveTo(x - 4, y + 8); ctx.lineTo(x - 16 - Math.random() * 6, y + 10); ctx.lineTo(x - 4, y + 12); ctx.fill(); }
    // dirty air (frame flag) and tow (drafting flag in the air)
    const f = flagAt(L, i, t);
    if (f & 131072) { ctx.strokeStyle = "rgba(255,84,104,.8)"; ctx.lineWidth = 1.5; ctx.beginPath(); for (let q = 0; q < 5; q++) ctx.lineTo(x + 10 + q * 4, y + (q % 2 ? -3 : 3)); ctx.stroke(); }
    else if ((f & 16384) && alt > 0.5) { ctx.strokeStyle = "rgba(53,224,255,.6)"; ctx.lineWidth = 1; for (let q = 0; q < 3; q++) { ctx.beginPath(); ctx.moveTo(x + 8, y - 4 + q * 4); ctx.lineTo(x + 22, y - 4 + q * 4); ctx.stroke(); } }
    glyph(x, y, e.position, i === lane ? 10 : 7, i === lane);
    if (i === lane) { ctx.fillStyle = "#fff"; ctx.font = "800 12px Barlow Condensed, sans-serif"; ctx.textAlign = "center"; ctx.fillText("ELLA", x, y + 24); ctx.textAlign = "left"; }
  }
  // speed lines of the followed runner's dive: 2 × (km/h − 80) px, 6 to 14 lines
  const v = speedAt(P, lane, t);
  const inDive = P.lanes[lane].dives.some((dv) => dv.t1 !== null && dv.d && t >= dv.t0 && t <= dv.t1 + dv.d.surgeTicks);
  if (inDive && !reduce) {
    const len = Math.max(0, 2 * (kmh(v) - 80));
    const nLines = Math.min(14, Math.max(6, Math.round(len / 6)));
    const x = xOf(camMm), y = yOf(altAt(P, lane, t)) - 9;
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
    for (let q = 0; q < nLines; q++) { const yy = y - 22 + (q * 44) / nLines; ctx.beginPath(); ctx.moveTo(x - 14, yy); ctx.lineTo(x - 14 - len * (0.5 + (q % 3) / 4), yy); ctx.stroke(); }
  }
  // impact ring proportional to the dive's gain
  for (const dv of P.lanes[lane].dives) if (dv.t1 !== null && dv.d && t >= dv.t1 && t < dv.t1 + 10) {
    const k = (t - dv.t1) / 10; ctx.strokeStyle = `rgba(255,200,61,${1 - k})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(xOf(colAt(L, lane, "posMm", dv.t1)), ground - 1, 8 + k * dv.d.gainMms / 200, 3 + k * 8, 0, 0, 7); ctx.stroke();
  }
  ctx.restore();
  // HUD
  document.getElementById("kmh").textContent = `${kmh(v)} km/h`;
  const a = altAt(P, lane, t);
  document.getElementById("band").textContent = BAND_NAME[Math.round(a)] || "SUELO";
  document.getElementById("place").textContent = `${rankAt(P, lane, t)}º`;
  const en = colAt(L, lane, "energy", t), enMax = Math.max(...L.frames.runners[lane].energy, 1);
  document.getElementById("en").textContent = `${Math.round(en / 1000)}`;
  document.getElementById("enbar").style.width = `${Math.round((100 * en) / enMax)}%`;
  tl.value = String(Math.round(t));
  // banners (at most 2 at a time, 1.4 s each) and chips (2 s, near her)
  const live = moments.filter((m) => t >= m.t && t < m.t + (m.kind === "banner" ? 21 : 30));
  const banners = live.filter((m) => m.kind === "banner").slice(-2);
  elBanners.innerHTML = banners.map((m) => `<div class="banner ${m.cls}">${m.text}</div>`).join("");
  const chips = live.filter((m) => m.kind === "chip").slice(-2);
  const cx = xOf(camMm), cy = yOf(a) - 26;
  elChips.innerHTML = chips.map((m, k) => `<div class="chip ${m.cls}" style="left:${Math.round(cx)}px;top:${Math.round(cy - k * 24)}px">${m.text}</div>`).join("");
  window.__shown = { banners: banners.map((m) => m.text), chips: chips.map((m) => m.text) };
}

// ---- loop and controls ---------------------------------------------------------------------------
let last = 0;
function loop(ts) {
  if (playing) {
    const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0;
    tick = Math.min(R.log.ticks, tick + dt * 15 * speed);
    if (tick >= R.log.ticks) playing = false;
    render();
  }
  last = ts;
  requestAnimationFrame(loop);
}
document.getElementById("races").innerHTML = races.map((r, k) => `<button role="tab" aria-selected="${k === 0}">${r.id}</button>`).join("");
document.querySelectorAll("#races button").forEach((b, k) => b.addEventListener("click", () => setRace(k)));
document.getElementById("follow").addEventListener("change", (ev) => { lane = Number(ev.target.value); trails.clear(); moments = momentsOf(R.P, lane); render(); });
document.getElementById("play").addEventListener("click", (ev) => { playing = !playing; ev.target.textContent = playing ? "❚❚" : "▶"; if (tick >= R.log.ticks) tick = 0; });
document.getElementById("slow").addEventListener("click", (ev) => { speed = speed === 1 ? 0.4 : 1; ev.target.textContent = speed === 1 ? "×1" : "×0,4"; });
tl.addEventListener("input", () => { tick = Number(tl.value); trails.clear(); render(); });
window.addEventListener("resize", () => { LY = layout(); render(); });
setRace(0);
requestAnimationFrame(loop);

// ---- checks for the harness (VIEW-1, VIEW-4): every number shown is the log's -----------------
window.__view = {
  races: races.map((r) => r.id),
  seek(k, t, followLane) { if (k !== races.indexOf(R)) setRace(k); if (followLane !== undefined) { lane = followLane; moments = momentsOf(R.P, lane); } tick = t; render(); return window.__shown; },
  check() {
    let maxBanners = 0, chips = 0, wrong = 0, frames = 0;
    const bad = [];
    races.forEach((r, k) => {
      setRace(k);
      for (const e of r.log.entries) {
        lane = e.lane; moments = momentsOf(r.P, lane);
        for (const m of moments) {
          if (m.num === undefined) continue;
          chips++;
          const s = m.src;
          let want;
          if (m.field === "cost/1000") want = Math.round(s.cost / 1000);
          else if (m.field === "kmh(vBeforeMms+gainMms)") want = Math.round(((s.vBeforeMms + s.gainMms) * 3.6) / 1000);
          else if (m.field === "kmh(lossMms)") want = Math.round((s.lossMms * 3.6) / 1000);
          else if (m.field === "surgeMm/1000") want = Number((s.surgeMm / 1000).toFixed(1));
          else if (m.field.startsWith("rank")) {
            const ds = r.log.events.find((x) => x.kind === "diveStart" && x.lane === s.lane && x.tick < s.tick && x.tick >= s.tick - 20);
            want = rankAt(r.P, s.lane, ds ? ds.tick : s.tick) - rankAt(r.P, s.lane, Math.min(s.tick + 45, r.log.ticks));
          }
          if (want !== m.num || !m.text.includes(String(m.num).replace(".", ","))) { wrong++; if (bad.length < 5) bad.push(`${r.id} lane ${lane} ${m.text} ≠ ${want}`); }
        }
        for (let t = 0; t <= r.log.ticks; t += 3) { tick = t; render(); frames++; maxBanners = Math.max(maxBanners, window.__shown.banners.length); }
      }
    });
    setRace(0);
    return { bandHeightPx360: Math.round(LY.bandPx * 10) / 10, maxBanners, chips, chipsWrong: wrong, numbersFromLog: wrong === 0 && chips > 0, frames, bad, logs: races.length };
  },
};
</script>
</body>
