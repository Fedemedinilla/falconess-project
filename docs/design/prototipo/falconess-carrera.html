<title>Falconess · Pantalla de carrera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#07090f; --panel:rgba(9,12,20,.92); --panel2:#121a28; --ink:#f4f7fb; --muted:#b4bfd0;
  --line:rgba(255,255,255,.16); --me:#35e0ff; --gold:#ffc83d; --danger:#ff5468; --ok:#4be3a0;
  --btn:#1b2434; --btn-hi:#26324a; --on:#f4f7fb; --on-ink:#0a0e16;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.col{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:700px){.col{max-width:390px;height:min(100%,880px);border-radius:22px;box-shadow:0 0 0 1px #222,0 20px 60px rgba(0,0,0,.6)}}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.ui{position:absolute;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:2}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:6px;background:linear-gradient(#05070c 70%,rgba(5,7,12,.0))}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-width:0;min-height:48px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:600 12px/1.1 var(--cond);letter-spacing:.02em;cursor:pointer}
.tabs button b{font:800 18px/1 var(--cond)}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs button[aria-selected="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-top:6px;background:linear-gradient(rgba(5,7,12,0),#05070c 18%)}
.tl{position:relative;height:30px;margin-bottom:4px}
.tl input{position:absolute;inset:0;width:100%;height:30px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2}
.tl input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:transparent}
.tl input::-moz-range-track{height:6px;background:transparent}
.tl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--me);border:3px solid #05070c}
.tl input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #05070c}
.tl .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:#2a3446;overflow:hidden}
.tl .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1a8fb0,var(--me))}
.tl .fin{position:absolute;top:0;bottom:0;background:rgba(255,200,61,.35)}
.tl .mk{position:absolute;top:7px;width:2px;height:16px;margin-left:-1px;border-radius:1px;background:#e8edf5;opacity:.75;pointer-events:none}
.tl .mk.warn{background:var(--danger);opacity:1}
.tl .mk.good{background:var(--gold);opacity:1}
.row{display:flex;gap:6px;align-items:stretch;margin-top:6px}
.row button,.seg button{min-height:46px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);
  font:700 15px/1 var(--cond);letter-spacing:.02em;cursor:pointer;padding:0 8px}
.row .primary{min-width:64px;background:var(--me);color:#04131a;border-color:var(--me)}
.row .primary svg{width:24px;height:24px}
.row button svg{width:22px;height:22px;display:block;margin:auto}
.seg{display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.seg button{border:0;border-radius:0;background:var(--btn);min-width:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.grow{flex:1}
.clock{margin-left:auto;align-self:center;font:700 16px/1 var(--cond);color:var(--muted);min-width:56px;text-align:right}
#bKey[aria-pressed="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.race button{min-width:58px}
.race button[data-race="lose"][aria-pressed="true"]{background:#ffd0d6}
/* result */
.result{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-left,0px));background:rgba(3,5,9,.72);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.result[hidden]{display:none}
.card{width:100%;max-width:370px;max-height:100%;overflow:auto;background:linear-gradient(160deg,#162236,#0b111c 60%);border:1px solid var(--line);border-radius:18px;padding:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.card .hd{display:flex;gap:12px;align-items:flex-end}
.card img{width:74px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.place{font:800 64px/0.9 var(--cond);color:var(--gold)}
.place.lose{color:#ffd0d6}
.sub{font:600 15px/1.2 var(--cond);color:var(--muted);margin-top:4px}
.card h2{font:800 22px/1.1 var(--cond);margin:14px 0 6px;letter-spacing:.02em;text-transform:uppercase}
.card p{margin:0 0 8px;font-size:15px;line-height:1.4}
.card ul{margin:6px 0 10px;padding-left:18px;font-size:14px;line-height:1.4;color:#dfe6f0}
.card li{margin:3px 0}
.card .tbl{display:grid;grid-template-columns:28px 1fr auto;gap:2px 8px;font:600 14px/1.5 var(--cond);margin:6px 0 12px;color:#dfe6f0}
.card .tbl .me{color:var(--me)}
.card .acts{display:flex;flex-direction:column;gap:8px}
.card .acts button{min-height:48px;border-radius:12px;border:1px solid var(--line);font:700 17px/1 var(--cond);cursor:pointer;background:var(--btn);color:var(--ink)}
.card .acts .go{background:var(--me);color:#04131a;border-color:var(--me)}
.ai{font-size:12px;color:#b4bfd0;margin:10px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
</style>
<div id="app"><div class="col" id="col">
  <canvas id="stage" aria-label="Carrera de Falconess"></canvas>
  <nav class="ui top" id="top" aria-label="Vistas">
    <div class="tabs" role="tablist">
      <button role="tab" data-view="A" aria-selected="false"><b>A</b><span>Persecución</span></button>
      <button role="tab" data-view="B" aria-selected="false"><b>B</b><span>Lateral</span></button>
      <button role="tab" data-view="C" aria-selected="false"><b>C</b><span>Dividida</span></button>
      <button role="tab" data-view="D" aria-selected="false"><b>D</b><span>Visor</span></button>
      <button role="tab" data-view="E" aria-selected="false"><b>E</b><span>Transmisión</span></button>
    </div>
  </nav>
  <div class="ui bottom" id="bottom">
    <div class="tl"><div class="track"><div class="fin" id="tlFin"></div><div class="fill" id="tlFill"></div></div><div id="marks"></div>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Momento de la carrera"></div>
    <div class="row">
      <button id="bRestart" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button id="bPlay" class="primary" aria-label="Reproducir"><svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
      <div class="seg" role="group" aria-label="Velocidad">
        <button data-speed="1" aria-pressed="true">x1</button><button data-speed="2" aria-pressed="false">x2</button><button data-speed="4" aria-pressed="false">x4</button>
      </div>
      <div class="clock" id="clock" aria-live="off">0,0 s</div>
    </div>
    <div class="row">
      <div class="seg race" role="group" aria-label="Carrera">
        <button data-race="win" aria-pressed="true">Gana</button><button data-race="lose" aria-pressed="false">Pierde</button>
      </div>
      <button id="bFinal" class="grow">Solo el final</button>
      <button id="bKey" class="grow" aria-pressed="false">Momentos clave</button>
    </div>
  </div>
  <div class="result" id="result" hidden role="dialog" aria-modal="false" aria-labelledby="resTitle">
    <div class="card">
      <div class="hd"><img id="resImg" alt="Peregrina"><div><div class="place" id="resPlace">1.º</div><div class="sub" id="resSub"></div></div></div>
      <h2 id="resTitle">Por qué ganó</h2>
      <p id="resMain"></p>
      <ul id="resFacts"></ul>
      <div class="tbl" id="resTbl"></div>
      <div class="acts"><button class="go" id="resReplay">Ver de nuevo los momentos clave</button><button id="resClose">Seguir mirando</button></div>
      <p class="ai">Arte provisional generado con IA</p>
    </div>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const DATA=JSON.parse($('#race-data').textContent);
const CHIBI=$('#chibiImg');
const TAU=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,k)=>a+(b-a)*k;
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
let RM=false; try{const mq=matchMedia('(prefers-reduced-motion: reduce)');RM=mq.matches;mq.addEventListener&&mq.addEventListener('change',e=>RM=e.matches);}catch(e){}
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

const FL={boost:1,pulse:2,cool:4,heat:8,exh:16,air:32,detour:64,stall:128,broken:256,plan:512,kick:1024,skill:2048,fin:4096,dnf:8192,draft:16384};
const MANU={koryu:{n:'Kōryū',c1:'#c0392b',c2:'#f1c40f'},lumiere:{n:'Lumière',c1:'#f5f0e1',c2:'#c9a227'},steinhaus:{n:'Steinhaus',c1:'#4a5a6a',c2:'#c8d0d8'},altair:{n:'Altair',c1:'#1b2a49',c2:'#2ec4f1'},boneyard:{n:'Boneyard',c1:'#8b4513',c2:'#6b7b3a'}};
const FRAMEN={shiden:'Shiden',etoile:'Étoile',hayate:'Hayate',falke:'Falke',erzherzog:'Erzherzog',horizon:'Horizon',kite:'Kite',mule:'Mule',nimbus:'Nimbus'};
const SEGN={flat:'Llano',descent:'Bajada',climb:'Subida',jump:'Salto',water:'Agua',canyon:'Cañón',curve:'Curva'};
const SEGC={flat:'#b8794a',descent:'#c8693f',climb:'#a07048',jump:'#1c100c',water:'#2f7fb8',canyon:'#8a4a32',curve:'#b8794a'};
const COL={good:'#4be3a0',warn:'#ff5468',skill:'#ffc83d',info:'#35e0ff',over:'#ffffff',amber:'#ffb340'};
const ME='#35e0ff';
const SKN=id=>DATA.skills[id]||id;
const fmtM=m=>Math.round(m).toLocaleString('es-ES');
const fmtS=s=>s.toFixed(1).replace('.',',');
const ord=n=>n+'.º';
const kmh=v=>Math.round(v*3.6);

/* ---------------- race prep ---------------- */
function prep(raw){
  const T=raw.T, N=raw.entries.length, P=raw.entries.findIndex(e=>e.runnerId==='player');
  const R={raw,T,N,P,len:raw.lengthMm/1000,finalM:raw.finalStartMm/1000,maxTick:T[T.length-1]};
  R.segs=raw.segments.map(s=>({type:s.type,a:s.startMm/1000,b:s.endMm/1000,param:s.param}));
  let h=0;R.ep=[[0,0]];
  for(const s of R.segs){const L=s.b-s.a;if(s.type==='descent')h-=L*Math.min(.2,(s.param||200)/2000);else if(s.type==='climb')h+=L*Math.min(.2,(s.param||200)/2000);R.ep.push([s.b,h]);}
  R.lanes=raw.runners;
  R.ent=raw.entries.map((e,l)=>{const m=MANU[e.manufacturer]||MANU.koryu;const fr=FRAMEN[e.frameId]||(e.frameId.charAt(0).toUpperCase()+e.frameId.slice(1));
    const me=l===P;const sk={};(e.skills||[]).forEach(s=>sk[s.id]=s.dur||30);
    return {name:me?'Peregrina':fr+' '+(l+1),short:me?'PEREGRINA':(fr+' '+(l+1)).toUpperCase(),man:m.n,
      c1:me?'#b3261e':m.c1,c2:me?'#f2b233':m.c2,glow:me?ME:m.c2,eMax:e.energy*1000,dMax:e.durabilityMax*1000,
      hpMax:raw.derived[l].hpMax,heatCap:raw.derived[l].heatCap,kickM:(raw.derived[l].kickAtMm||raw.lengthMm*.97)/1000,
      passive:e.passive,stats:e.stats,skillDur:sk};});
  R.ev=raw.events.slice().sort((a,b)=>a.tick-b.tick);
  R.L=Array.from({length:N},()=>({modes:[],pulses:[],jumps:[],skills:[],plans:[],hpEmpty:null,finish:null}));
  for(const e of R.ev){const L=R.L[e.lane];if(!L)continue;
    switch(e.kind){
      case 'boostMode':L.modes.push({t:e.tick,mode:e.mode,m:e.posMm/1000});break;
      case 'pulse':L.pulses.push({t:e.tick,chain:e.chain,thrust:e.thrustMms});break;
      case 'jumpOk':L.jumps.push({t0:e.tick,t1:null,lift:e.lift,req:e.required});break;
      case 'landing':{const j=L.jumps.find(j=>j.t1===null);if(j){j.t1=e.tick;j.loss=e.speedLossMms;}break;}
      case 'skill':L.skills.push({t:e.tick,id:e.skillId,dur:R.ent[e.lane].skillDur[e.skillId]||30});break;
      case 'sprintPlan':L.plans.push({t:e.tick,a:e.startMm/1000,b:e.endMm/1000,cause:e.cause,index:e.index});break;
      case 'hpEmpty':L.hpEmpty={t:e.tick,m:e.posMm/1000};break;
      case 'finish':L.finish={t:e.finishMilli/1000,place:e.place};break;
    }}
  R.L.forEach(L=>L.jumps.forEach(j=>{if(j.t1===null)j.t1=j.t0+60;}));
  R.place=[];raw.results.forEach(r=>{R.place[r.lane]=r.place;if(!R.L[r.lane].finish)R.L[r.lane].finish={t:r.finishMilli/1000,place:r.place};});
  R.winner=raw.results.find(r=>r.place===1).lane;
  // integer-tick positions and order
  R.posI=[];for(let l=0;l<N;l++)R.posI.push(new Float32Array(R.maxTick+1));
  for(let tk=0;tk<=R.maxTick;tk++){const [i,u,dt]=idxAt(R,tk);for(let l=0;l<N;l++)R.posI[l][tk]=posAt(R,l,i,u,dt);}
  R.order=[];R.rank=Array.from({length:N},()=>new Uint8Array(R.maxTick+1));
  for(let tk=0;tk<=R.maxTick;tk++){const o=orderAt(R,tk,l=>R.posI[l][tk]);R.order.push(o);o.forEach((l,k)=>R.rank[l][tk]=k+1);}
  // overtakes (player involved) + leader changes, debounced
  R.over=[];
  for(let o=0;o<N;o++){if(o===P)continue;let rel=null,pend=null;
    for(let tk=12;tk<=R.maxTick;tk++){const ah=R.rank[P][tk]<R.rank[o][tk];
      if(rel===null){rel=ah;continue;}
      if(ah!==rel){if(pend===null)pend=tk;if(tk-pend>=8){R.over.push({t:pend,passer:ah?P:o,passed:ah?o:P});rel=ah;pend=null;}}else pend=null;}}
  {let ld=null,pend=null,cand=null;for(let tk=12;tk<=R.maxTick;tk++){const l0=R.order[tk][0];if(ld===null){ld=l0;continue;}
    if(l0!==ld){if(pend===null||cand!==l0){pend=tk;cand=l0;}if(tk-pend>=8){if(l0!==P&&ld!==P)R.over.push({t:pend,passer:l0,passed:ld,lead:true});else if(!R.over.some(x=>Math.abs(x.t-pend)<3))R.over.push({t:pend,passer:l0,passed:ld,lead:true});ld=l0;pend=null;}}else pend=null;}}
  R.over.forEach(x=>{if(x.lead===undefined)x.lead=R.rank[x.passer][Math.min(R.maxTick,x.t+8)]===1;});
  R.over.sort((a,b)=>a.t-b.t);
  buildCallouts(R);
  R.finalTick=0;for(let tk=0;tk<=R.maxTick;tk++){const lead=R.order[tk][0];if(R.posI[lead][tk]>=R.finalM-70){R.finalTick=tk;break;}}
  R.slow=new Uint8Array(R.maxTick+1);
  R.moments.forEach(m=>{for(let k=Math.max(0,m-10);k<=Math.min(R.maxTick,m+22);k++)R.slow[k]=1;});
  buildReason(R);
  return R;
}
function bs(T,t){let lo=0,hi=T.length-1;if(t>=T[hi])return hi;while(hi-lo>1){const m=(lo+hi)>>1;if(T[m]<=t)lo=m;else hi=m;}return lo;}
function idxAt(R,t){const T=R.T,last=T.length-1;let i=bs(T,t),u=0;if(i>=last){i=last-1;u=1;}else u=(t-T[i])/(T[i+1]-T[i]);return [i,u,(T[i+1]-T[i])/15];}
function posAt(R,l,i,u,dt){const L=R.lanes[l];const p0=L.p[i],p1=L.p[i+1],v0=L.v[i],v1=L.v[i+1];const u2=u*u,u3=u2*u;
  let p=(2*u3-3*u2+1)*p0+(u3-2*u2+u)*dt*v0+(-2*u3+3*u2)*p1+(u3-u2)*dt*v1;return clamp(p,Math.min(p0,p1),Math.max(p0,p1))/1000;}
function orderAt(R,t,pos){const a=[];for(let l=0;l<R.N;l++)a.push(l);
  return a.sort((x,y)=>{const fx=R.L[x].finish&&R.L[x].finish.t<=t,fy=R.L[y].finish&&R.L[y].finish.t<=t;
    if(fx&&fy)return R.L[x].finish.t-R.L[y].finish.t;if(fx)return -1;if(fy)return 1;return pos(y)-pos(x);});}
function segAt(R,m){for(const s of R.segs)if(m>=s.a&&m<s.b)return s;return m<0?R.segs[0]:{type:'flat',a:R.len,b:R.len+999,param:0,after:true};}
function elev(R,m){const ep=R.ep;if(m<=0)return 0;for(let k=1;k<ep.length;k++)if(m<=ep[k][0]){const a=ep[k-1],b=ep[k];return lerp(a[1],b[1],(m-a[0])/(b[0]-a[0]||1));}return ep[ep.length-1][1];}
function slopeAt(R,m){return (elev(R,m+4)-elev(R,m-4))/8;}

function buildCallouts(R){
  const P=R.P,E=R.ent,C=[],M=new Set([0]);
  const add=(t,lane,text,sub,kind,extra)=>{C.push(Object.assign({t,lane,text,sub,kind},extra||{}));};
  add(0,P,'¡SALIDA!','2000 m · desierto','info',{prio:2});
  const passive=E[P].passive;
  for(const e of R.ev){const me=e.lane===P,nm=E[e.lane]?E[e.lane].name:'';
    switch(e.kind){
      case 'skill':add(e.tick,e.lane,SKN(e.skillId),me?'tu habilidad':nm,'skill',{prio:me?3:1});M.add(e.tick);break;
      case 'skillMiss':if(me){add(e.tick,e.lane,'Falló '+SKN(e.skillId),'no se activó','warn',{prio:2});M.add(e.tick);}break;
      case 'boostMode':if(!me)break;
        if(e.mode==='dive-descent'){add(e.tick,P,'PICADA','pliega las alas en la bajada','good',{prio:2});M.add(e.tick);}
        else if(e.mode==='hold'){add(e.tick,P,'RESERVA','guarda energía para su sprint','info',{prio:2});M.add(e.tick);}
        else if(e.mode==='plan'){add(e.tick,P,'¡SPRINT!','alas abiertas a los '+fmtM(e.posMm/1000)+' m','good',{prio:4,cut:'chase',big:true});M.add(e.tick);}
        else if(e.mode==='kick'){add(e.tick,P,'¡EMPUJE FINAL!','todo al propulsor','good',{prio:4,cut:'chase',big:true});M.add(e.tick);}
        break;
      case 'sprintPlan':if(me&&e.index===0){add(e.tick,P,'PLAN DE SPRINT','de '+fmtM(e.startMm/1000)+' a '+fmtM(e.endMm/1000)+' m','info',{prio:2});M.add(e.tick);}break;
      case 'pulse':if(me){const tl=passive==='talon-lock'&&e.chain%2===0;
          add(e.tick,P,'PULSO ×'+e.chain,tl?'Garra fija: +24 % de empuje':'+'+kmh(e.thrustMms/1000)+' km/h de empuje','good',{prio:3});M.add(e.tick);}break;
      case 'jumpOk':if(me){add(e.tick,P,'SALTO','empuje '+Math.round(e.lift/1000)+' · necesita '+Math.round(e.required/1000),'good',{prio:3,cut:'side'});M.add(e.tick);}break;
      case 'landing':if(me){add(e.tick,P,'ATERRIZAJE','−'+kmh(e.speedLossMms/1000)+' km/h','info',{prio:2});M.add(e.tick);}break;

    const rivPlans=R.L.filter((x,l)=>l!==P).map(x=>x.modes.find(m=>m.mode==='plan')).filter(Boolean).map(m=>m.m).sort((a,b)=>a-b);

  }else{

    const seg=segAt(R,(a+b)/2);ctx.fillStyle=seg.after?'#8d6a52':SEGC[seg.type]||SEGC.flat;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<=n;i++){const m=lerp(a,b,i/n);ctx.lineTo(X(m),GY(m));}ctx.stroke();
    ctx.beginPath();for(let i=0;i<=n;i++){const m=lerp(a,b,i/n);ctx.lineTo(X(m),GY(m)+laneGap*8.5);}ctx.stroke();};
  const cuts=[m0];for(const s of R.segs){if(s.b>m0&&s.a<m1){if(s.a>m0)cuts.push(s.a);if(s.b<m1)cuts.push(s.b);}}cuts.push(m1);

    renderSide(r,{cam:camSide,focus:lead,fit,pad:30,minWin:40,maxWin:200,size:r.h*.22,depth:true,gy:.66});}
  // stinger
  const sa=NOW-shot.stinger;if(sa<.35&&!RM){const k=sa/.35;ctx.fillStyle='#ffc83d';ctx.save();ctx.beginPath();const x=r.x-r.w*.5+k*r.w*2;ctx.moveTo(x,r.y);ctx.lineTo(x+r.w*.35,r.y);ctx.lineTo(x+r.w*.1,r.y+r.h);ctx.lineTo(x-r.w*.25,r.y+r.h);ctx.fill();ctx.restore();}
  // bug
  ctx.font=FONT(800,13);ctx.textBaseline='middle';const bx=r.x+r.w-12;ctx.textAlign='right';
  ctx.fillStyle='rgba(5,7,12,.85)';rr(bx-118,r.y+10,118,26,5);ctx.fill();ctx.fillStyle='#ff5468';ctx.beginPath();ctx.arc(bx-106,r.y+23,5,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText('EN VIVO · '+(shot.type==='chase'?'CÁM 2':shot.type==='wide'?'CÁM 1':'CÁM 3'),bx-8,r.y+24);
  const me=S[R.P];const toGo=Math.max(0,R.len-S[lead].pos);
  ctx.fillStyle='rgba(5,7,12,.85)';rr(bx-118,r.y+40,118,24,5);ctx.fill();ctx.fillStyle=S[lead].pos>=R.finalM?'#ffc83d':'#dfe6f0';ctx.font=FONT(700,13);ctx.fillText(S[lead].fin?'LLEGADA':'FALTAN '+fmtM(toGo)+' m',bx-8,r.y+53);
  // tower
  const ordr=R.order[Math.min(R.maxTick,Math.floor(t))];const tx=r.x+10,ty=r.y+10,tw=150,rh=21;
  ctx.fillStyle='rgba(5,7,12,.88)';rr(tx,ty,tw,rh*R.N+26,6);ctx.fill();ctx.fillStyle='#ffc83d';ctx.fillRect(tx,ty,tw,22);
  ctx.fillStyle='#1a1200';ctx.font=FONT(800,13);ctx.textAlign='left';ctx.fillText('CARRERA · 2000 m',tx+8,ty+12);
  ordr.forEach((l,k)=>{const y=ty+24+k*rh;const st=S[l],E=R.ent[l],mine=l===R.P;
    if(mine){ctx.fillStyle='rgba(53,224,255,.25)';ctx.fillRect(tx+2,y,tw-4,rh-1);}
    ctx.fillStyle=k===0?'#ffc83d':'#fff';ctx.font=FONT(800,14);ctx.textAlign='left';ctx.fillText(String(k+1),tx+7,y+rh/2);
    ctx.fillStyle=E.c1;ctx.fillRect(tx+22,y+4,5,rh-9);ctx.fillStyle=E.c2;ctx.fillRect(tx+27,y+4,2,rh-9);
    ctx.font=FONT(mine?800:600,13);ctx.fillStyle=mine?'#9ff0ff':'#e8edf5';ctx.fillText(mine?'PEREGRINA':E.name.toUpperCase(),tx+34,y+rh/2);
    let gap='';if(k>0){if(st.fin&&S[ordr[0]].fin)gap='+'+fmtS(R.L[l].finish.t/15-R.L[ordr[0]].finish.t/15)+'s';else if(!st.fin)gap='+'+Math.round(Math.max(0,(S[ordr[0]].fin?R.len:S[ordr[0]].pos)-st.pos))+'m';}
    else if(st.fin)gap=fmtS(R.L[l].finish.t/15)+'s';
    ctx.textAlign='right';ctx.font=FONT(600,12);ctx.fillStyle=st.exh&&!st.fin?'#ff8a98':'#cfd8e6';ctx.fillText(st.exh&&!st.fin&&k>0?'✕ '+gap:gap,tx+tw-6,y+rh/2);
  });
  // lower third
  const cs=liveCallouts(2.6).filter(a=>a.c.prio>=1);
  if(cs.length){const a=cs[cs.length-1],c=a.c;const age=NOW-a.born;const k=RM?1:clamp(age*5,0,1),out=clamp((2.6-age)*3,0,1);
    const h=58,y=r.y+r.h-h-14,x=r.x+12,w=r.w-24;const col=COL[c.kind]||'#fff';
    ctx.save();ctx.globalAlpha=out;ctx.translate((1-k)*-40,0);
    ctx.fillStyle='rgba(5,7,12,.92)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-14,y+h);ctx.lineTo(x,y+h);ctx.fill();
    ctx.fillStyle=col;ctx.fillRect(x,y,8,h);
    const tag=c.lane===R.P||(c.over&&(c.over.passer===R.P||c.over.passed===R.P))?'PEREGRINA':c.over?'ADELANTAMIENTO':c.kind==='skill'?'HABILIDAD':'CARRERA';
    ctx.font=FONT(800,12);const tw2=ctx.measureText(tag).width+12;ctx.fillStyle=col;ctx.fillRect(x+16,y-10,tw2,18);ctx.fillStyle='#0a0e16';ctx.textAlign='left';ctx.fillText(tag,x+22,y);
    ctx.font=FONT(800,24);ctx.fillStyle='#fff';ctx.fillText(c.text,x+18,y+24);ctx.font=FONTB(600,13);ctx.fillStyle='#dfe6f0';ctx.fillText(c.sub||'',x+18,y+45);ctx.restore();}
  // replay mark in key mode
  if(keyMode&&R.slow[Math.floor(t)]){ctx.font=FONT(800,13);ctx.fillStyle='rgba(5,7,12,.85)';rr(r.x+r.w-130,r.y+68,118,24,5);ctx.fill();ctx.fillStyle='#ffc83d';ctx.textAlign='right';ctx.fillText('CÁMARA LENTA',r.x+r.w-20,r.y+81);}
}

/* ---------------- main loop ---------------- */
function stageRect(){return {x:0,y:topH,w:W,h:Math.max(200,H-topH-botH)};}
let lastNow=performance.now();
function frame(now){
  dtw=Math.min(.1,(now-lastNow)/1000);lastNow=now;NOW=now/1000;
  if(playing){let rate=15*speed;if(keyMode){const tg=R.slow[Math.floor(t)]?.4:7;kf=lerp(kf,tg,Math.min(1,dtw*5));rate*=kf;}
    t=Math.min(R.maxTick,t+dtw*rate);if(t>=R.maxTick){playing=false;syncPlay();}}
  fireCallouts(prevT,t);prevT=t;
  computeStates();updateVis();
  shakeA*=Math.pow(.02,dtw);flashA*=Math.pow(.01,dtw);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#07090f';ctx.fillRect(0,0,W,H);
  const r=stageRect();
  ({A:viewA,B:viewB,C:viewC,D:viewD,E:viewE})[view](r);
  if(flashA>.02){ctx.fillStyle=hexA(flashC,flashA*.6);ctx.fillRect(r.x,r.y,r.w,r.h);}
  if(keyMode&&playing&&view!=='E'){const sl=R.slow[Math.floor(t)];ctx.font=FONT(800,12);ctx.textAlign='right';ctx.textBaseline='middle';const txt=sl?'CÁMARA LENTA':'AVANCE RÁPIDO ▶▶';const w=ctx.measureText(txt).width+12;
    ctx.fillStyle='rgba(5,7,12,.85)';rr(r.x+r.w-w-12,r.y+r.h-30,w,22,5);ctx.fill();ctx.fillStyle=sl?'#ffc83d':'#dfe6f0';ctx.fillText(txt,r.x+r.w-18,r.y+r.h-19);}
  updateUI();
  const pf=R.L[R.P].finish;if(pf&&!resultShown&&t>=pf.t+28){showResult();}
  requestAnimationFrame(frame);
}

/* ---------------- UI ---------------- */
const scrub=$('#scrub');
function updateUI(){const f=t/R.maxTick;if(document.activeElement!==scrub||!scrubbing)scrub.value=Math.round(f*1000);$('#tlFill').style.width=(f*100)+'%';
  $('#clock').textContent=fmtS(t/15)+' s';}
let scrubbing=false;
scrub.addEventListener('pointerdown',()=>scrubbing=true);scrub.addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{setT(scrub.value/1000*R.maxTick);});
function setT(nt){t=clamp(nt,0,R.maxTick);prevT=t;active=[];cut=null;snap=true;prevFiredZero=t>0;camSide.init=camSide2.init=camSide3.init=false;
  const pf=R.L[R.P].finish;if(!pf||t<pf.t+28){hideResult();resultShown=false;}}
function syncPlay(){$('#bPlay').setAttribute('aria-label',playing?'Pausa':'Reproducir');
  $('#bPlay').innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';}
function play(){if(t>=R.maxTick)setT(0);playing=true;if(t===0){prevFiredZero=false;}syncPlay();}
$('#bPlay').addEventListener('click',()=>{if(playing){playing=false;syncPlay();}else play();});
$('#bRestart').addEventListener('click',()=>{setT(0);prevFiredZero=false;play();});
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
document.querySelectorAll('[data-race]').forEach(b=>b.addEventListener('click',()=>{setRace(b.dataset.race);}));
$('#bFinal').addEventListener('click',()=>{setT(R.finalTick);play();});
$('#bKey').addEventListener('click',()=>{keyMode=!keyMode;kf=1;$('#bKey').setAttribute('aria-pressed',String(keyMode));});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
function setView(v){view=v;store.set('falconess.race.view',v);cut=null;snap=true;camSide.init=camSide2.init=camSide3.init=false;
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.view===v)));}
function setRace(k){raceKey=k;R=RACES[k];store.set('falconess.race.race',k);document.querySelectorAll('[data-race]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.race===k)));
  buildMarks();resultShown=false;hideResult();setT(0);prevFiredZero=false;}
function buildMarks(){const m=$('#marks');m.innerHTML='';$('#tlFin').style.left=(R.finalTick/R.maxTick*100)+'%';$('#tlFin').style.width=((R.maxTick-R.finalTick)/R.maxTick*100)+'%';
  const seen=new Set();for(const c of R.callouts){if(c.prio<3||c.t===0)continue;const k=Math.round(c.t/8);if(seen.has(k))continue;seen.add(k);const d=document.createElement('div');d.className='mk '+(c.kind==='warn'?'warn':c.big?'good':'');d.style.left=(c.t/R.maxTick*100)+'%';m.appendChild(d);}}
// keyboard
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.key===' '){e.preventDefault();$('#bPlay').click();}
  else if(/^[a-eA-E]$/.test(e.key))setView(e.key.toUpperCase());});

/* ---------------- result card ---------------- */
function showResult(){resultShown=true;const pl=R.place[R.P];const tt=R.L[R.P].finish.t/15;
  $('#resImg').src=CHIBI.src;$('#resPlace').textContent=ord(pl);$('#resPlace').className='place'+(pl>1?' lose':'');
  $('#resSub').textContent='de '+R.N+' · '+fmtS(tt)+' s'+(pl>1?' · a '+fmtS(tt-R.L[R.winner].finish.t/15)+' s de '+R.ent[R.winner].name:' · '+fmtS(R.L[R.raw.results.find(x=>x.place===2).lane].finish.t/15-tt)+' s de ventaja');
  $('#resTitle').textContent=R.reasonTitle;$('#resMain').textContent=R.reasonMain;
  const ul=$('#resFacts');ul.innerHTML='';R.facts.forEach(f=>{const li=document.createElement('li');li.textContent=f;ul.appendChild(li);});
  const tb=$('#resTbl');tb.innerHTML='';R.raw.results.slice().sort((a,b)=>a.place-b.place).forEach(x=>{const me=x.lane===R.P;
    [ord(x.place),R.ent[x.lane].name,fmtS(x.finishMilli/15000)+' s'].forEach(s=>{const d=document.createElement('div');d.textContent=s;if(me)d.className='me';tb.appendChild(d);});});
  $('#result').hidden=false;$('#resReplay').focus({preventScroll:true});}
function hideResult(){$('#result').hidden=true;}
$('#resClose').addEventListener('click',()=>{hideResult();});
$('#resReplay').addEventListener('click',()=>{hideResult();keyMode=true;kf=1;$('#bKey').setAttribute('aria-pressed','true');setT(0);prevFiredZero=false;play();});

/* ---------------- init ---------------- */
document.querySelectorAll('[data-race]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.race===raceKey)));
setView(view);buildMarks();resize();setT(0);prevFiredZero=false;syncPlay();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize).catch(()=>{});
window.__race={get t(){return t;},setT:v=>setT(v),play,pause:()=>{playing=false;syncPlay();},setView,setRace,get R(){return R;},speed:v=>{speed=v;}};
requestAnimationFrame(frame);
})();
</script>
