<title>Falconess · Temporada de prueba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --sky1:#c4e3f8; --sky2:#e3f1fb; --sky3:#f4f7fa; --bg:#dcebf6;
  --white:#ffffff; --soft:#eef2f5; --track:#e3ebf2; --line:#d3dbe3; --ui:#8795a3;
  --tx:#14202b; --tx2:#4b5967; --yel:#f1c40f; --ink:#1d1704; --rank:#7a5a00;
  --gain:#b34f00; --ok:#1e7b46; --warn:#c46a00; --warnt:#9a4a00; --warnbg:#fff1de;
  --hi:#7a2a00; --acc:#c0392b; --accpress:#a93226; --livery:#c0392b; --chip1:#fff0b3; --chip2:#ffd9a8; --chip3:#5a3d1e;
  --shadow:0 2px 8px rgba(20,32,43,0.10); --scrim:rgba(20,32,43,0.45);
  --cn:'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Barlow, system-ui, sans-serif;font-size:15px;line-height:1.35;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;margin:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.cn{font-family:var(--cn);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- marco: el teléfono se llena; en escritorio, columna de 390 ---- */
.app{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;max-width:440px;margin:0 auto;display:flex;container:app / size;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top:max(14px, env(safe-area-inset-top, 0px)); padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  overflow:hidden}
@media (min-width:700px) and (min-height:640px){
  body{display:flex;align-items:center;justify-content:center}
  .app{width:390px;max-width:390px;height:min(844px, calc(100% - 40px));margin:auto;border-radius:28px;box-shadow:0 10px 40px rgba(20,32,43,0.18)}
}

/* ---- HUD ---- */
.hud{flex:none;display:flex;gap:12px;height:100px;position:relative;z-index:2}
.cal{flex:0 0 84px;border-radius:14px;background:var(--white);box-shadow:var(--shadow);overflow:hidden;text-align:center}
.cal-h{height:22px;line-height:22px;background:var(--yel);color:var(--ink);font-size:13px;font-weight:600}
.cal-n{font-family:var(--cn);font-weight:700;font-size:48px;line-height:50px;margin-top:4px}
.cal-s{font-size:13px;font-weight:600;line-height:18px;color:var(--tx2)}
.hud-r{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.goal{height:52px;border-radius:26px;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;min-width:0}
.goal-ic{flex:0 0 36px;height:36px;border-radius:18px;background:var(--yel);display:flex;align-items:center;justify-content:center}
.goal-t{min-width:0}
.goal-n{font-family:var(--cn);font-weight:700;font-size:20px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-s{font-size:13px;font-weight:600;line-height:17px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow{height:36px;display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:600;color:var(--tx2)}
.vbar{flex:1;min-width:0;height:20px;border:2px solid var(--ui);border-radius:10px;background:var(--white);position:relative;overflow:hidden}
.vfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2bb0e6,#4cc27a 55%,var(--yel));border-radius:0 8px 8px 0;transition:width .5s ease}
.vcost{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(20,32,43,0.62) 0px,rgba(20,32,43,0.62) 3px,rgba(255,255,255,0.6) 3px,rgba(255,255,255,0.6) 7px);box-shadow:inset 0 0 0 2px var(--tx);border-radius:0 8px 8px 0;animation:blink 1.4s ease-in-out infinite}
.vcost.plus{background:repeating-linear-gradient(135deg,rgba(30,123,70,0.55) 0px,rgba(30,123,70,0.55) 3px,rgba(255,255,255,0.7) 3px,rgba(255,255,255,0.7) 7px);box-shadow:inset 0 0 0 2px var(--ok)}
@keyframes blink{50%{opacity:.55}}
.mood{flex:none;min-width:76px;height:36px;padding:0 10px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--cn);font-weight:700;font-size:20px;white-space:nowrap}
.m-hi{background:var(--yel);color:var(--ink)} .m-mid{background:var(--white);color:var(--tx);box-shadow:var(--shadow)} .m-lo{background:var(--warnbg);color:var(--warnt);box-shadow:inset 0 0 0 2px var(--warn)}

/* ---- pantallas ---- */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}
.foot{flex:none;display:flex;gap:10px;align-items:stretch}
.panel{background:var(--white);border-radius:14px;box-shadow:var(--shadow)}
.title{font-family:var(--cn);font-weight:700;font-size:26px;line-height:30px;margin:0}
.sub{font-size:15px;line-height:20px;color:var(--tx2);margin:0}
.cap{font-size:13px;font-weight:600;color:var(--tx2);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin:4px 0 -4px}

/* escenario */
.stage{flex:1 1 0;min-height:110px;position:relative;overflow:hidden}
.stage .glow{position:absolute;left:50%;top:6%;width:200px;height:200px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.9),rgba(255,255,255,0) 70%)}
.stage .floor{position:absolute;left:12%;right:12%;bottom:4%;height:36px;border-radius:50%;background:rgba(135,149,163,0.22)}
.stage{container-type:size}
.stage .runner{position:absolute;left:50%;top:2%;bottom:1%;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.stage .runner img{display:block;height:100%;width:auto;max-width:none;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.01)}}
.stage .runner.chibi{top:64px;bottom:2px}
.stage .runner.chibi img{animation:none}
@container (max-height:150px){.stage .runner.chibi{display:none}}
.who{position:absolute;left:0;top:6px;z-index:1}
.who b{display:block;font-family:var(--cn);font-weight:700;font-size:24px;line-height:28px}
.who span{font-size:13px;font-weight:600;color:var(--tx2)}

/* tira de stats */
.strip{flex:none;display:grid;grid-template-columns:1fr 50px;gap:6px}
.stats{display:flex;height:64px;overflow:hidden}
.st{flex:1;min-width:0;text-align:center}
.st-h{height:22px;line-height:22px;background:var(--soft);font-family:var(--cn);font-weight:600;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.st.on .st-h{background:var(--yel);color:var(--ink)}
.st-v{height:42px;display:flex;align-items:center;justify-content:center;gap:3px;border-right:1px solid var(--line)}
.st:last-child .st-v{border-right:0}
.rk{font-family:var(--cn);font-weight:700;font-size:20px;color:var(--rank)}
.val{font-family:var(--cn);font-weight:700;font-size:21px}
/* número de stat con relieve de medalla: degradé metálico, contorno oscuro y brillo */
.sn{background:linear-gradient(180deg,var(--ta) 0%,var(--ta) 42%,var(--tb) 58%,var(--tc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.7px var(--tk);filter:drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 1.5px 1px rgba(20,25,35,.28));font-size:23px;letter-spacing:.2px}
.sn.t0{--ta:#a9b0b9;--tb:#7d8691;--tc:#555d67;--tk:#3a4049}
.sn.t1{--ta:#5fd6b4;--tb:#1a9b7c;--tc:#0b6550;--tk:#06402f}
.sn.t2{--ta:#7fb8ff;--tb:#2e6fd6;--tc:#173c8c;--tk:#0e2659}
.sn.t3{--ta:#ffb877;--tb:#cc6e25;--tc:#7f3c10;--tk:#4f2508}
.sn.t4{--ta:#ff8cbb;--tb:#cc1f68;--tc:#760c39;--tk:#4a0623}
.sn.t5{--ta:#ffe680;--tb:#e0a90a;--tc:#8f6200;--tk:#5a3d00}
.sn.t6{--ta:#ffffff;--tb:#a8d3f0;--tc:#4f7596;--tk:#2c4a63}
@media (prefers-reduced-motion:no-preference){.sn.t6{animation:plat 3s ease-in-out infinite}}
@keyframes plat{50%{filter:drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 0 4px rgba(150,210,255,.9))}}
.pts{height:64px;overflow:hidden;text-align:center}
.pts .st-h{background:var(--soft)}
.pts .val{display:block;font-size:24px;line-height:42px}
.short{display:none}
@media (max-width:440px){.long{display:none}.short{display:inline}}

/* menú */
.acts{flex:none;display:grid;grid-template-columns:42% 1fr;gap:12px 12px}
.shutter{grid-row:span 4;min-height:200px;border-radius:16px;background:var(--acc);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 4px 0 rgba(20,32,43,0.18);padding:12px}
.shutter:active{background:var(--accpress);transform:translateY(2px);box-shadow:0 2px 0 rgba(20,32,43,0.18)}
.shutter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 22px,rgba(0,0,0,0.10) 22px,rgba(0,0,0,0.10) 24px)}
.shutter > *{position:relative}
.shutter .dbl{position:absolute;right:10px;top:10px}
.shutter .big{font-family:var(--cn);font-weight:700;font-size:32px;line-height:34px}
.shutter .small{font-size:15px;font-weight:600;line-height:18px}
.plate{height:44px;min-height:44px;border-radius:14px;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;text-align:left;min-width:0}
.plate .pl{font-family:var(--cn);font-weight:700;font-size:21px;line-height:24px;white-space:nowrap}
.plate .end{margin-left:auto;display:flex;align-items:center}
.plate:disabled{opacity:.45;box-shadow:none}
.plate:not(:disabled):active,.btn:not(:disabled):active{transform:translateY(1px)}
.badge{min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--yel);color:var(--ink);font-family:var(--cn);font-weight:700;font-size:20px;line-height:28px;text-align:center}
.next{font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap}
.btn{min-height:48px;border-radius:14px;background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:600;padding:0 14px}
.btn.icon{width:48px;flex:0 0 48px;padding:0}
.btn.crewb{flex:0 0 42%;justify-content:flex-start;gap:8px}
.btn.crewb .pl{font-family:var(--cn);font-weight:700;font-size:20px}
.btn.crewb .badge{margin-left:auto}
.btn.main{flex:1;background:var(--acc);color:#fff;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(20,32,43,0.18);min-height:56px}
.btn.main:active{background:var(--accpress)}
.btn.main b{font-family:var(--cn);font-weight:700;font-size:22px;line-height:24px}
.btn.main span{font-size:13px;font-weight:600;line-height:16px}
.btn.dark{flex:1;background:var(--tx);color:#fff;min-height:56px;font-family:var(--cn);font-weight:700;font-size:21px}
.btn:disabled{background:var(--soft);color:var(--tx2);box-shadow:inset 0 0 0 2px var(--line)}
.back{flex:0 0 auto;min-width:104px;min-height:56px}
.spacer{flex:1}
.note{padding:12px 14px;font-size:15px;line-height:20px}
.warnbox{border-radius:12px;background:var(--warnbg);display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:15px;line-height:19px;flex:none}
.warnbox svg{flex:0 0 22px}

/* entrenar */
.legend{flex:none;height:18px;display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;font-weight:600;color:var(--tx2);margin:-6px 0 -6px}
.legend i{width:18px;height:10px;border:2px solid var(--tx);border-radius:3px;background:repeating-linear-gradient(135deg,rgba(20,32,43,0.62) 0px,rgba(20,32,43,0.62) 2px,#fff 2px,#fff 5px)}
.ribbon{position:absolute;left:0;top:8px;height:48px;padding:0 34px 0 0;background:var(--yel);clip-path:polygon(0 0,100% 0,88% 100%,0 100%);display:flex;align-items:center;gap:10px;padding-left:12px;border-radius:10px 0 0 10px}
.ribbon small{display:block;font-size:12px;font-weight:600;line-height:14px;color:var(--ink)}
.ribbon b{display:block;font-family:var(--cn);font-weight:700;font-size:24px;line-height:26px;color:var(--ink)}
.crewp{position:absolute;right:0;top:4px;width:80px;text-align:center}
.portrait{width:56px;height:56px;margin:0 auto;border-radius:28px;background:var(--white);border:3px solid var(--tx);display:flex;align-items:center;justify-content:center;font-family:var(--cn);font-weight:700;font-size:22px}
.crewp .nm{font-size:13px;font-weight:600;line-height:16px;margin-top:4px}
.seg{display:flex;gap:2px;justify-content:center;margin-top:4px}
.seg i{width:11px;height:7px;border-radius:2px;background:var(--line);box-shadow:inset 0 0 0 1px var(--ui)}
.seg i.on{background:var(--yel)}
.gains{flex:none;display:grid;grid-template-columns:1fr 50px;gap:6px;height:36px;margin-bottom:-8px}
.gains .g5{display:flex}
.gains .g5 > div,.gains .gp{flex:1;text-align:center}
.gn{font-family:var(--cn);font-weight:700;font-size:32px;line-height:36px;color:var(--gain);text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff;display:inline-block;animation:pop .35s ease-out}
.gp .gn{font-size:24px}
@keyframes pop{from{transform:translateY(8px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.hint{font-size:15px;color:var(--tx2);line-height:36px;white-space:nowrap}
.rounds{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rc{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:12px;min-width:0}
.rbtn{width:min(64px,100%);aspect-ratio:1/1;border-radius:50%;background:var(--white);box-shadow:0 4px 0 #b8c4cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rbtn .lv{font-family:var(--cn);font-weight:700;font-size:13px;line-height:15px;color:var(--tx2)}
.rbtn.risk{box-shadow:0 4px 0 #b8c4cf,inset 0 0 0 3px var(--warn)}
.rbtn.sel{background:var(--acc);box-shadow:0 4px 0 rgba(20,32,43,0.3),inset 0 0 0 3px var(--yel)}
.rbtn.sel::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--tx);pointer-events:none;animation:selring .18s ease-out}
@keyframes selring{from{transform:scale(1.18);opacity:0}to{transform:none;opacity:1}}
.rbtn.sel .lv{color:#fff}
.rbtn .cb{position:absolute;right:-6px;top:-6px;min-width:26px;height:22px;padding:0 4px;border-radius:11px;background:var(--yel);color:var(--ink);font-family:var(--cn);font-weight:700;font-size:13px;line-height:22px;box-shadow:0 0 0 2px #fff}
.rname{margin-top:8px;text-align:center;font-family:var(--cn);font-weight:700;font-size:14px;line-height:16px;min-height:32px}
.bubble{position:absolute;top:0;left:50%;transform:translateX(-50%);height:32px;padding:0 10px;border-radius:16px;color:#fff;font-family:var(--cn);font-weight:700;font-size:17px;line-height:32px;white-space:nowrap}
.rc:first-child .bubble{left:0;transform:none}
.rc:last-child .bubble{left:auto;right:0;transform:none}
.bubble::after{content:"";position:absolute;top:31px;left:calc(50% - 7px);border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid var(--bc)}
.rc:first-child .bubble::after{left:calc(min(64px,100%)/2 - 7px)}
.rc:last-child .bubble::after{left:auto;right:calc(min(64px,100%)/2 - 7px)}
/* cuadrilla en Entrenar · 5 variantes (sin desplazamientos al elegir) */
.cav{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#14202b;border:2.5px solid var(--bc);box-shadow:0 0 0 1px rgba(20,32,43,.55);font-family:var(--cn);font-weight:700;font-size:12px;line-height:1;letter-spacing:0;flex:none;box-sizing:border-box}
.cvchip{position:absolute;left:0;bottom:6px;height:32px;padding:0 10px 0 7px;border-radius:16px;background:#fff7d6;color:#1d1704;box-shadow:inset 0 0 0 1.5px #c79a00;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;z-index:2}
.cvchip b{font-family:var(--cn);font-size:16px}
.cvchip span{font-size:12px;color:#4b3b00}
/* 1 · pastilla bajo el nombre (fila reservada) */
.rounds.cv1 .crow{height:28px;display:flex;align-items:flex-start;justify-content:center}
.cpill{display:inline-flex;align-items:center;gap:1px;height:28px;padding:0 2px 0 3px;border-radius:14px;background:#fff7d6;box-shadow:inset 0 0 0 1.5px #c79a00,0 0 0 1px rgba(20,32,43,.25)}
.rounds.cv1 .rbtn.boost:not(.sel),.rounds.cv2 .rbtn.boost:not(.sel){box-shadow:0 4px 0 #b8c4cf,inset 0 0 0 2.5px #e2b100}
.rounds.cv1 .rbtn.risk.boost:not(.sel),.rounds.cv2 .rbtn.risk.boost:not(.sel){box-shadow:0 4px 0 #b8c4cf,inset 0 0 0 3px var(--warn)}
/* 2 · medalla en el borde inferior */
.rounds.cv2 .rname{margin-top:18px}
.rounds.cv2 .rbtn.boost{padding-bottom:14px;gap:0}
.rounds.cv2 .rbtn.boost svg:first-child{width:22px;height:22px}
.medal{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.medal .cav{width:28px;height:28px;font-size:12px;border-width:3px}
.mbolt{position:absolute;right:-9px;bottom:-1px;width:16px;height:16px;border-radius:50%;background:#f1c40f;box-shadow:0 0 0 1.5px #14202b;display:flex;align-items:center;justify-content:center}
/* 3 · anillo dorado + rayo; retrato grande arriba a la derecha */
.rounds.cv3 .rbtn.boost,.rounds.cv4 .rbtn.boost{box-shadow:0 4px 0 #b8c4cf,0 0 0 3px #f1c40f,0 0 0 4px rgba(20,32,43,.55)}
.rounds.cv3 .rbtn.boost.risk,.rounds.cv4 .rbtn.boost.risk{box-shadow:0 4px 0 #b8c4cf,inset 0 0 0 3px var(--warn),0 0 0 3px #f1c40f,0 0 0 4px rgba(20,32,43,.55)}
.rounds.cv3 .rbtn.boost.sel,.rounds.cv4 .rbtn.boost.sel{box-shadow:0 4px 0 rgba(20,32,43,0.3),inset 0 0 0 3px var(--yel),0 0 0 3px #f1c40f}
.gdot{position:absolute;right:-3px;bottom:-1px;width:20px;height:20px;border-radius:50%;background:#f1c40f;box-shadow:0 0 0 1.5px #14202b;display:flex;align-items:center;justify-content:center}
.rounds.cv3 .gdot{right:-7px;bottom:8px}
.foot .btn.dark{line-height:24px}
.crewp{z-index:1;top:12px}
.pv > *{flex:none}
.crewp .portrait{position:relative;width:60px;height:60px;border-radius:50%;border:4px solid var(--bc);box-shadow:0 0 0 2px #f1c40f,0 0 0 3px rgba(20,32,43,.6);font-size:22px;color:#14202b}
.pbolt{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#f1c40f;box-shadow:0 0 0 1.5px #14202b;display:flex;align-items:center;justify-content:center}
.crewp .nm{display:inline-block;padding:0 6px;border-radius:8px;background:rgba(255,255,255,.9)}
/* 4 · iniciales dentro, nivel bajo el nombre */
.cin{display:inline-flex;align-items:center;gap:1px;height:18px;margin-top:2px;padding:0 4px 0 2px;border-radius:9px;background:#fff7d6;color:#14202b;box-shadow:inset 0 0 0 2px var(--bc);font-family:var(--cn);font-weight:700;font-size:13px;line-height:1}
.rounds.cv4 .rname{min-height:32px}
.lvt{height:20px;margin-top:2px;padding:0 6px;border-radius:10px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--cn);font-weight:700;font-size:13px;line-height:20px;color:var(--tx2)}
/* 5 · franja de vista previa; sin burbuja */

.rounds.cv5 .gdot{right:auto;left:auto;top:-2px;right:-2px;bottom:auto;width:18px;height:18px}
.pv{flex:none;height:36px;margin-bottom:-6px;display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;border-radius:12px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden;white-space:nowrap}
.pv.empty{font-size:13px;color:var(--tx2);font-weight:600}
.pvg{font-family:var(--cn);font-weight:700;font-size:16px;color:var(--gain)}
.pvf{margin-left:auto;height:26px;padding:0 8px;border-radius:13px;color:#fff;font-family:var(--cn);font-weight:700;font-size:15px;line-height:26px}
.pvc{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 6px 0 2px;border-radius:14px;background:#fff7d6;box-shadow:inset 0 0 0 1.5px #c79a00}
.pvn{font-family:var(--cn);font-weight:700;font-size:13px;color:#1d1704}
@media (max-width:370px){ .pvn{display:none} .pvg{font-size:15px} }
@media (prefers-reduced-motion:reduce){ .rbtn.sel::before{animation:none} }
/* fallo · 3 ubicaciones (ninguna mueve nada al elegir) */
.stchips{position:absolute;left:0;bottom:6px;display:flex;gap:6px;z-index:2}
.stchips .cvchip{position:static}
.fchip{padding:0 10px}
/* 1 · junto al vigor */
.fpill{flex:none;width:72px;height:26px;border-radius:13px;color:#fff;font-family:var(--cn);font-weight:700;font-size:14px;line-height:26px;text-align:center;white-space:nowrap;box-shadow:0 0 0 1.5px #fff}
.fpill.none{background:var(--soft);color:var(--tx2);box-shadow:inset 0 0 0 1.5px var(--line)}
.vrow.fv1{gap:6px}
.vrow.fv1 .mood{min-width:0;width:40px;padding:0}
.vrow.fv1 .mood span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 2 · dentro del botón de confirmar */
.foot .btn.cbtn{height:56px;flex:1 1 0;min-width:0}
.cbtn .cl{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center}
.cbtn.f2{padding:0 8px 0 12px;gap:8px}
.cbtn.f2 .cl{flex:1;font-size:18px;line-height:20px;overflow-wrap:anywhere}
.ctag{flex:none;height:30px;padding:0 8px;border-radius:15px;color:#fff;font-family:var(--cn);font-weight:700;font-size:14px;line-height:30px;white-space:nowrap;box-shadow:0 0 0 2px #fff}
/* 3 · pegado al borde superior del botón */
.ftag{position:absolute;left:50%;top:-10px;transform:translateX(-50%);z-index:3;height:19px;padding:0 5px;border-radius:10px;color:#fff;font-family:var(--cn);font-weight:700;font-size:12px;line-height:19px;white-space:nowrap;box-shadow:0 0 0 1.5px #fff;pointer-events:none}
.rounds.cv5.f3 .rbtn.sel .gdot{top:auto;bottom:-1px}

/* carreras */
.weeks{flex:none;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{height:60px;border-radius:12px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.wk .n{font-family:var(--cn);font-weight:700;font-size:20px;line-height:20px}
.wk.raced{background:var(--soft);color:var(--tx2)}
.wk.today{background:var(--yel);color:var(--ink)}
.wk.today .n{font-size:24px;line-height:24px}
.wk.today small{font-size:12px;font-weight:600;line-height:12px}
.wk.goalw{box-shadow:inset 0 0 0 2px var(--tx)}
.wk.streak::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-8px;height:4px;border-radius:2px;background:var(--warn)}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:4px;background:currentColor}
.wleg{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:600;color:var(--tx2);margin-top:2px}
.wleg span{display:flex;align-items:center;gap:4px}
.ticket{flex:none;width:100%;min-height:108px;border-radius:14px;background:var(--white);box-shadow:var(--shadow),inset 0 0 0 3px var(--white);text-align:left;overflow:hidden;display:flex}
.ticket[aria-pressed="true"]{box-shadow:var(--shadow),inset 0 0 0 3px var(--tx)}
.stub{flex:0 0 72px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:2px dashed var(--line);padding:6px 2px}
.stub b{font-family:var(--cn);font-weight:700;font-size:17px;line-height:19px}
.stub span{font-size:13px;line-height:16px;color:var(--tx2)}
.stub em{font-style:normal;margin-top:4px;font-size:12px;font-weight:600;line-height:18px;color:#fff;background:var(--tx);border-radius:8px;padding:0 5px;white-space:nowrap}
.tk{flex:1;min-width:0;position:relative;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.tk .tn{font-family:var(--cn);font-weight:700;font-size:21px;line-height:24px;padding-right:30px}
.tk .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{height:28px;line-height:28px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap}
.tk .feat{font-size:15px;color:var(--tx2)}
.tk .bot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.tk .k{font-size:12px;font-weight:600;color:var(--tx2)}
.tk .prize{display:flex;align-items:baseline;gap:4px}
.tk .prize b{font-family:var(--cn);font-weight:700;font-size:22px}
.check{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:13px;background:var(--yel);display:flex;align-items:center;justify-content:center}

/* taller */
.trow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tchips{display:flex;gap:8px}
.tchip{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:18px;background:var(--white);box-shadow:var(--shadow)}
.tchip .k{font-size:12px;font-weight:600;color:var(--tx2)}
.tchip b{font-family:var(--cn);font-weight:700;font-size:20px}
.bay{flex:none;position:relative;display:flex;min-height:140px;overflow:hidden;border-radius:16px}
.bay .rack{flex:0 0 42%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.bay .rack svg{width:100%;max-width:150px;height:auto}
.bay .info{flex:1;min-width:0;padding:14px 14px 14px 12px}
.pill{display:inline-block;height:20px;line-height:20px;padding:0 8px;border-radius:10px;background:var(--yel);font-size:12px;font-weight:600;color:var(--ink)}
.bay .wn{font-family:var(--cn);font-weight:700;font-size:22px;line-height:26px;margin-top:4px}
.dur{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--tx2);margin-top:10px}
.durbar{height:12px;margin-top:4px;border-radius:6px;background:var(--track);border:1px solid var(--ui);overflow:hidden}
.durbar div{height:100%;background:var(--tx2);transition:width .4s}
.hangar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard{position:relative;min-height:76px;border-radius:14px;background:var(--white);box-shadow:var(--shadow),inset 0 0 0 3px var(--white);text-align:left;padding:7px 10px}
.hcard[aria-pressed="true"]{box-shadow:var(--shadow),inset 0 0 0 3px var(--tx)}
.hcard b{display:block;font-family:var(--cn);font-weight:700;font-size:20px;line-height:22px}
.hcard span{display:block;font-size:13px;line-height:17px;color:var(--tx2)}
.hcard .check{width:24px;height:24px;right:8px;top:8px}
.skills{flex:none;overflow:hidden}
.sk{min-height:54px;display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-top:1px solid var(--line)}
.sk:first-child{border-top:0}
.sk .snm{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.sk .snm > span:first-child{font-size:16px;font-weight:600;line-height:20px}
.sk .cost{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.sk .cost b{font-family:var(--cn);font-weight:700;font-size:20px}
.learn{flex:0 0 96px;height:44px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 2px var(--ui);font-size:15px;font-weight:600}
.learn.ask{background:var(--yel);color:var(--ink);box-shadow:none}
.learn.done{background:var(--white);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.learn:disabled:not(.done){color:var(--tx2);box-shadow:inset 0 0 0 2px var(--line);background:var(--white)}

/* elegir corredora */
.pickc{flex:none;width:100%;min-height:120px;border-radius:16px;background:var(--white);box-shadow:var(--shadow),inset 0 0 0 3px var(--white);display:flex;align-items:stretch;gap:12px;padding:8px 14px 8px 0;text-align:left;overflow:hidden;position:relative}
.pickc[aria-pressed="true"]{box-shadow:var(--shadow),inset 0 0 0 3px var(--tx)}
.pickc .sw{flex:0 0 6px;background:var(--c)}
.pickc .pic{flex:0 0 58px;display:flex;align-items:flex-end;justify-content:center}
.pickc .pic img{height:104px;width:auto;display:block}
.pickc .pt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding-right:22px}
.pickc .pn{font-family:var(--cn);font-weight:700;font-size:26px;line-height:28px}
.pickc .ps{font-size:14px;font-weight:600;color:var(--tx2)}
.pickc .pp{font-size:15px;line-height:19px;margin-top:2px}
.pickc .check{right:10px;top:10px}
.aitag{margin:0;font-size:12px;line-height:16px;color:var(--tx2);text-align:center}
.rhead{display:flex;align-items:flex-end;gap:10px}
.rhead img{flex:none;height:76px;width:auto;display:block}
.rhead > div{min-width:0}
.hopper{flex:0 0 48px;height:100px;display:flex;align-items:flex-end;justify-content:center}
.hopper img{height:100px;width:auto;display:block;transform-origin:50% 100%;animation:hop .26s ease-in-out 6 alternate both}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
.reveal{animation:rv .3s ease-out both;animation-delay:var(--d,0s)}
@keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hud[hidden]{display:none}

/* equipo */
.crew{display:flex;align-items:center;gap:12px;padding:12px 14px;flex:none}
.crew .portrait{margin:0;flex:0 0 56px}
.crew b{font-family:var(--cn);font-weight:700;font-size:21px;line-height:24px}
.crew .cs{font-size:13px;color:var(--tx2);line-height:17px}
.crew .seg{justify-content:flex-start}
.crew .now{font-size:13px;font-weight:600;color:var(--tx);margin-top:4px}

/* fin */
.endc{flex:none;padding:20px 16px;text-align:center}
.grade{width:104px;height:104px;margin:8px auto 4px;border-radius:52px;background:var(--yel);color:var(--ink);font-family:var(--cn);font-weight:700;font-size:60px;line-height:104px}
.glist{list-style:none;margin:0;padding:0}
.glist li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.glist li:first-child{border-top:0}
.glist .gl{flex:1;min-width:0}
.glist b{font-family:var(--cn);font-weight:700;font-size:20px}

/* popups */
dialog{border:0;padding:0;margin:auto;width:min(358px, calc(100% - 32px));max-height:calc(100% - 48px);border-radius:20px;background:var(--white);color:var(--tx);box-shadow:0 14px 40px rgba(20,32,43,0.28);overflow:auto}
dialog::backdrop{background:var(--scrim)}
dialog[open]{animation:dlg .22s ease-out}
@keyframes dlg{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.dl{padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px}
.dl-top{display:flex;align-items:center;gap:12px}
.dl-ic{flex:0 0 48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.dl-ic.good{background:var(--ok)} .dl-ic.bad{background:var(--warnt)} .dl-ic.neutral{background:var(--yel)}
.dl-k{font-size:13px;font-weight:600;color:var(--tx2);letter-spacing:.04em;text-transform:uppercase}
.dl h2{margin:0;font-family:var(--cn);font-weight:700;font-size:34px;line-height:36px}
.dl .why{margin:-6px 0 0;font-size:15px;color:var(--tx2)}
.rows{list-style:none;margin:0;padding:0;border-radius:14px;background:var(--soft)}
.rows li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:48px}
.rows li:first-child{border-top:0}
.rows .n{font-family:var(--cn);font-weight:700;font-size:24px;min-width:48px;color:var(--gain)}
.rows .n.down{color:var(--warnt)} .rows .n.plain{color:var(--tx)}
.rows .t{flex:1;min-width:0;font-size:15px;line-height:19px}
.rows .t small{display:block;font-size:13px;color:var(--tx2)}
.upchip{flex:none;font-size:12px;font-weight:600;background:var(--yel);color:var(--ink);border-radius:8px;padding:2px 8px}
.verdict{border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.verdict.good{background:#e3f4ea;color:#14552f}
.verdict.bad{background:var(--warnbg);color:var(--hi)}
.dl-acts{display:flex;gap:10px}
.dl-acts .btn{flex:1;min-height:52px}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list .btn{justify-content:flex-start}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--tx);color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}


/* ===== menú de la semana: cinco diseños con la corredora de protagonista ===== */
.hero{position:absolute;inset:0;z-index:0;overflow:hidden;container-type:size;pointer-events:none}
.hero .glow2{position:absolute;left:50%;top:14%;width:120cqw;height:60cqh;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,0.85),rgba(255,255,255,0))}
.hero .fl{position:absolute;left:8%;right:8%;bottom:3%;height:9cqh;border-radius:50%;background:radial-gradient(closest-side,rgba(135,149,163,0.38),rgba(135,149,163,0));display:none}
.hero img{position:absolute;display:block;max-width:none;width:auto;height:calc(var(--k) * 100cqh);
  top:calc(var(--ty) * 100cqh - var(--fy) * var(--k) * 100cqh);
  left:calc(var(--tx) * 100cqw - var(--cx) * var(--k) * var(--ar) * 100cqh);
  transform-origin:50% 60%;animation:breathe2 3.6s ease-in-out infinite}
@keyframes breathe2{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.008)}}
.L-A .hero{--k:1.3;--ty:.27;--tx:.5}
.L-B .hero{--k:1.62;--ty:.25;--tx:.5}
.L-C .hero{--k:1.04;--ty:.2;--tx:.68}
.L-D .hero{--k:.82;--ty:.235;--tx:.5}
.L-D .hero .fl{display:block}
.L-E .hero{--k:1.36;--ty:.28;--tx:.5}
.home .lbl{background:rgba(255,255,255,0.92);border-radius:10px;padding:2px 7px;color:var(--tx)}
.lay{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.lay > *{position:relative;z-index:1}
.topline{flex:none;display:flex;align-items:flex-start;gap:8px;min-height:44px}
.who2{background:rgba(255,255,255,0.86);border-radius:12px;padding:4px 10px 5px;box-shadow:var(--shadow);max-width:60%}
.who2 b{display:block;font-family:var(--cn);font-weight:700;font-size:22px;line-height:24px}
.who2 span{display:block;font-size:12px;font-weight:600;line-height:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-height:0}
/* chip de diseño */
.lchip{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));top:calc(max(14px, env(safe-area-inset-top, 0px)) + 110px);z-index:3;display:flex;align-items:center;gap:2px;height:44px;padding:0 4px;border-radius:22px;background:rgba(20,32,43,0.84);color:#fff;box-shadow:var(--shadow)}
.lchip .lk{font-size:12px;font-weight:600;padding:0 6px 0 8px;color:#e6edf3}
.lchip button{height:44px;min-width:40px;padding:0 6px;border-radius:20px;font-family:var(--cn);font-weight:700;font-size:19px;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px}
.lchip button[aria-pressed="true"]{background:var(--yel);color:var(--ink);height:36px;min-width:36px}
.lchip .lc1{padding:0 12px 0 10px;font-family:Barlow, system-ui, sans-serif;font-size:13px;font-weight:600}
.lchip .lc1 b{font-family:var(--cn);font-size:20px;background:var(--yel);color:var(--ink);border-radius:12px;min-width:26px;line-height:26px;text-align:center}
.lseg{display:flex;gap:6px}
.lseg button{flex:1;height:48px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 2px var(--line);font-family:var(--cn);font-weight:700;font-size:22px}
.lseg button[aria-pressed="true"]{background:var(--yel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--tx)}
/* piezas comunes */
.bdg{position:absolute;right:6px;top:6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--yel);color:var(--ink);font-family:var(--cn);font-weight:700;font-size:17px;line-height:24px;text-align:center;box-shadow:0 0 0 2px #fff}
.nt{font-size:12px;font-weight:600;line-height:14px;color:var(--tx2)}
.lay .prim{background:var(--acc);color:#fff}
.lay .prim:not(:disabled):active{background:var(--accpress)}
.prim .sb{font-size:13px;font-weight:600;line-height:16px;color:#fff}
.lay button:disabled{opacity:.5}
.lay button:not(:disabled):active{transform:translateY(1px)}
.srow{display:flex;border-radius:14px;overflow:hidden}
.sc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 0;border-right:1px solid var(--line)}
.sc:last-child{border-right:0}
.sc .sh{font-size:11px;font-weight:600;line-height:13px;color:var(--tx2);white-space:nowrap}
.sc .sv{font-family:var(--cn);font-weight:700;font-size:18px;line-height:20px;white-space:nowrap}
.sc .sv i{font-style:normal;color:var(--rank);margin-right:2px}
.sc.pt{background:rgba(241,196,15,0.22)}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.mbtn{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:rgba(255,255,255,0.92);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.fullb{margin:0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) calc(-14px - env(safe-area-inset-bottom, 0px)) calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}

/* A · Clásico Uma */
.bandA{flex:none;display:flex;flex-direction:column;gap:10px;padding-top:44px !important;background:linear-gradient(180deg,rgba(255,255,255,0) 0,rgba(255,255,255,0.55) 40px,rgba(255,255,255,0.7) 100%)}
.bandA .strip{position:relative}
.pills{display:grid;grid-template-columns:1fr 1.4fr 1fr;grid-auto-rows:64px;gap:8px}
.pill2{position:relative;border-radius:22px;background:rgba(255,255,255,0.95);box-shadow:0 3px 0 rgba(20,32,43,0.16),0 2px 8px rgba(20,32,43,0.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:0 4px}
.pill2 .lb{font-family:var(--cn);font-weight:700;font-size:18px;line-height:20px;white-space:nowrap}
.pill2 .nt{position:absolute;right:8px;top:5px}
.pill2.prim{margin-top:-16px;border-radius:26px;box-shadow:0 4px 0 rgba(20,32,43,0.22),0 4px 12px rgba(20,32,43,0.18)}
.pill2.prim .lb{font-size:26px;line-height:28px}

function makeOffers(){
  const off = new Set();
  for (let m = 0; m < 12; m++){
    const ws = [1,2,3,4].map(i => m*4+i).filter(w => !isGoal(w) && !isGoal(w+1));
    const want = 2 + (rnd() < .5 ? 1 : 0);
    let have = ws.filter(w => off.has(w)).length;
    const free = ws.filter(w => !off.has(w)).sort(() => rnd() - .5);
    while (have < want && free.length){ off.add(free.pop()); have++; }
  }
  return [...off].sort((a,b) => a-b);
}

function crewFor(w){

    const slots = [-1,-1,-1,-1,-1];
    [0,1,2,3].sort(() => rnd() - .5).forEach(c => {
      if (rnd() < .45){
        const s = rnd() < .7 ? pick(CREWS[c].pref) : Math.floor(rnd()*5);
        if (slots[s] < 0) slots[s] = c;
      }
    });
    S.crew[w] = slots;
  }
  return S.crew[w];
}
function ticketsFor(w){
  if (!S.tickets[w]){
    const idx = TRACKS.map((t,i) => i).sort(() => rnd() - .5), out = [], terrs = new Set();
    for (const i of idx){ if (out.length < 3 && !terrs.has(TRACKS[i].terr)){ out.push(i); terrs.add(TRACKS[i].terr); } }
    S.tickets[w] = out;
  }

}
const offered = w => S.offers.includes(w) && !isGoal(w) && !isGoal(w+1);
function streakBefore(w){ let n = 0; while (S.raced.includes(w-1-n)) n++; return n; }

const curve = v => v >= 60 ? 0 : 60 * Math.pow((60 - v)/60, 2);
function failPct(i){
  const c = curve(S.vigor), t = TRAIN[i];

}
const MOODK = [.8,.9,.95,1,1.1];
function gainFor(i){
  const t = TRAIN[i], lv = S.fac[i] - 1, c = crewFor(S.week)[i];
  let main = (t.base[0] + 2*lv), sec = (t.base[1] + lv), pts = t.pts ? t.pts + lv : 0;
  if (c >= 0){ main += 2 + S.bonds[c]; sec += 1; if (t.pts) pts += 2; }
  const k = MOODK[S.mood], gr = RUN().growth;
  return {main:Math.round(main*k*(1+gr[t.main])), sec:Math.round(sec*k*(1+gr[t.sec])), pts, crew:c};
}

function perf(terr, pen){
  const avg = S.stats.reduce((a,b) => a+b, 0) / 5;

  const sk = 1 + .02*S.skills.length;
  const vk = S.vigor >= 30 ? 1 : .96;
  return avg*m*wf*dk*sk*vk*(1-pen) + gauss()*12;
}

function doTrain(i){

function raceCommon(terr, pen, mean, cap, label){
  const st = streakBefore(S.week);

function trainHTML(){
  const crew = crewFor(S.week), s = UI.sel;
  const t = s >= 0 ? TRAIN[s] : null, g = s >= 0 ? gainFor(s) : null;
  let gains;
  if (t){
    const cells = [0,1,2,3,4].map(i => `<div>${i === t.main ? `<span class="gn">+${g.main}</span>` : i === t.sec ? `<span class="gn">+${g.sec}</span>` : ""}</div>`).join("");
    gains = `<div class="gains" aria-live="polite"><div class="g5">${cells}</div><div class="gp">${g.pts ? `<span class="gn">+${g.pts}</span>` : ""}</div><span class="sr">${t.name}: +${g.main} ${NAMES[t.main]}, +${g.sec} ${NAMES[t.sec]}${g.pts ? `, +${g.pts} puntos` : ""}. Fallo ${failPct(s)} %.</span></div>`;
  } else gains = `<div class="gains"><div class="hint">Tocá un entrenamiento para ver qué sube.</div></div>`;
  const ref = t ? s : 0;
  const ci = t ? crew[s] : -1;
  const ribbon = t ? `<div class="ribbon">${icon(t.ic,26,"#1d1704","2.4")}<div><small>Instalación · Nv ${S.fac[s]}</small><b>${t.name}</b></div></div>` : "";
  const cv = CREWV;
  const portrait = ci >= 0 && cv === "3" ? `<div class="crewp"><div class="portrait" style="--bc:${BONDC[S.bonds[ci]]}" aria-hidden="true">${CREWS[ci].ini}<span class="pbolt">${icon("bolt",13,"#1d1704","2.8")}</span></div><div class="nm">${CREWS[ci].name}</div><div class="seg" aria-label="Vínculo ${S.bonds[ci]} de 5">${segs(S.bonds[ci])}</div></div>` : "";
  const fv = FALV;
  const fchip = `<button type="button" class="cvchip fchip" data-act="fv" aria-label="Fallo: opción ${fv}, ${FVNAME[fv]}. Tocá para ver la siguiente">Fallo <b>${fv}</b><span aria-hidden="true">/3</span></button>`;
  const cvchip = `<button type="button" class="cvchip" data-act="cv" aria-label="Insignia de cuadrilla: opción ${cv}, ${CVNAME[cv]}. Tocá para ver la siguiente">${icon("bolt",14,"#1d1704","2.8")}Cuadrilla <b>${cv}</b><span aria-hidden="true">/5</span></button>`;
  let pv = "";
  if (cv === "5"){
    if (t){
      const f = failPct(s), bc = f === 0 ? "var(--ok)" : f < 25 ? "var(--warnt)" : "var(--hi)";
      pv = `<div class="pv" aria-hidden="true"><span class="pvg">+${g.main} ${ABBR[t.main].replace(".","")}</span><span class="pvg">+${g.sec} ${ABBR[t.sec].replace(".","")}</span>${g.pts ? `<span class="pvg">+${g.pts} pts</span>` : ""}<span class="pvf" style="background:${bc}">Fallo ${f} %</span>${ci >= 0 ? `<span class="pvc">${cav(ci)}<span class="pvn">${CREWS[ci].name}</span></span>` : ""}</div>`;
    } else pv = `<div class="pv empty" aria-hidden="true">Elegí un entrenamiento para ver ganancia, fallo y cuadrilla.</div>`;
  }
  const rounds = TRAIN.map((tr,i) => {
    const sel = i === s, f = failPct(i), c = crew[i];
    const bc = f === 0 ? "var(--ok)" : f < 25 ? "var(--warnt)" : "var(--hi)";
    const b = c >= 0;
    const lvIn = cv === "4" ? (b ? `<span class="cin" style="--bc:${BONDC[S.bonds[c]]}">${icon("bolt",12,"#1d1704","2.8")}${CREWS[c].ini}</span>` : "") : `<span class="lv">Nv ${S.fac[i]}</span>`;
    let deco = "";
    if (b && cv === "2") deco = `<span class="medal" aria-hidden="true">${cav(c)}<span class="mbolt">${icon("bolt",10,"#1d1704","3")}</span></span>`;
    if (b && (cv === "3" || cv === "5")) deco = `<span class="gdot" aria-hidden="true">${icon("bolt",cv === "3" ? 12 : 10,"#1d1704","3")}</span>`;
    const ftag = sel && fv === "3" ? `<span class="ftag" style="${riskS(f)}" aria-hidden="true">Fallo ${f} %</span>` : "";
    return `<div class="rc">
      <button type="button" class="rbtn${tr.risk ? " risk" : ""}${sel ? " sel" : ""}${b ? " boost" : ""}" data-act="pick" data-i="${i}" aria-pressed="${sel}" aria-label="${tr.name}, Nv ${S.fac[i]}${b ? ", potenciado, con " + CREWS[c].name : ""}${sel ? `, elegido, fallo ${f} %: tocá otra vez para entrenar` : ""}">
        ${icon(tr.ic,26,sel ? "#ffffff" : "#14202b")}${lvIn}${deco}${ftag}</button>
      <div class="rname">${tr.name === "Vuelo de riesgo" ? "Vuelo de<br>riesgo" : tr.name}</div>
      ${cv === "4" ? `<div class="lvt" aria-hidden="true">Nv ${S.fac[i]}</div>` : ""}
      ${cv === "1" ? `<div class="crow" aria-hidden="true">${b ? `<span class="cpill">${icon("bolt",12,"#1d1704","2.8")}${cav(c)}</span>` : ""}</div>` : ""}
    </div>`;
  }).join("");
  return `<div class="body">
    ${stageHTML("chibi")}${ribbon}${portrait}<div class="stchips">${cvchip}${fchip}</div></div>
    ${gains}
    ${stripHTML(t ? [t.main, t.sec] : [])}
    ${pv}
    <div class="rounds cv${cv} f${fv}">${rounds}</div>
  </div>
  <div class="foot">
    <button type="button" class="btn back" data-act="home">${icon("back",20,"currentColor","2.4")}<span>Volver</span></button>
    <button type="button" class="btn dark cbtn${fv === "2" ? " f2" : ""}" data-act="confirmTrain" ${t ? "" : "disabled"}><span class="cl">${t ? "Entrenar " + t.name : "Elegí uno"}</span>${t && fv === "2" ? `<span class="ctag" style="${riskS(failPct(s))}">Fallo ${failPct(s)} %</span>` : ""}</button>
  </div>`;
}
/* avatar de cuadrilla: iniciales + anillo de vínculo */
function cav(c){ return `<span class="cav" style="--bc:${BONDC[S.bonds[c]]}">${CREWS[c].ini}</span>`; }
function segs(n){ return [0,1,2,3,4].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join(""); }

function weeksHTML(){
  const w = S.week, start = clamp(w-2, 1, 42), st = streakBefore(w);
  const cells = [];
  for (let x = start; x < start+7; x++){
    const raced = S.raced.includes(x) && x < w, goal = isGoal(x), today = x === w;
    const streak = st >= 2 && offered(w) && x >= w - st && x <= w;
    let cls = "wk", inner;
    if (today){ cls += " today"; inner = `<small>Hoy</small><span class="n">${x}</span>${offered(x) ? '<span class="dots"><i></i><i></i><i></i></span>' : goal ? icon("flag",14,"#1d1704","2.4") : ""}`; }
    else if (raced){ cls += " raced"; inner = `<span class="n">${x}</span>${icon("trophy",14,"#4b5967","2.4")}`; }
    else if (goal){ cls += " goalw"; inner = `<span class="n">${x}</span>${icon("flag",16,"#14202b","2.4")}`; }
    else inner = `<span class="n">${x}</span>${offered(x) && x > w ? '<span class="dots" style="color:#4b5967"><i></i><i></i><i></i></span>' : '<span class="dots"></span>'}`;
    if (streak) cls += " streak";
    const lab = `Semana ${x}${today ? ", hoy" : ""}${raced ? ", corrió" : ""}${goal ? ", carrera objetivo" : ""}${offered(x) && !raced ? ", hay carreras" : ""}`;
    cells.push(`<div class="${cls}" role="listitem" aria-label="${lab}">${inner}</div>`);
  }
  return `<div class="weeks" role="list" aria-label="Semanas">${cells.join("")}</div>
  <div class="wleg" aria-hidden="true"><span>${icon("trophy",14,"#4b5967","2.4")}Corrió</span><span><span class="dots" style="color:#4b5967"><i></i></span>Hay carreras</span><span>${icon("flag",14,"#14202b","2.4")}Objetivo</span>${st >= 2 && offered(w) ? `<span style="color:var(--warnt)"><i style="width:14px;height:4px;border-radius:2px;background:var(--warn);display:inline-block"></i>Seguidas</span>` : ""}</div>`;
}
function racesHTML(){
  const w = S.week, off = offered(w), st = streakBefore(w), vc = st >= 2 ? 25 : 15;
  let content;
  if (off){
    const ts = ticketsFor(w);
    const warn = st >= 2 ? `<div class="warnbox">${icon("warn",22,"#9a4a00")}<span>${st === 2 ? `Sería su 3.ª carrera seguida (corrió la ${w-2} y la ${w-1}). Cansa más.` : `Sería su ${st+1}.ª carrera seguida: el ánimo va a bajar.`}</span></div>` : "";
    content = warn + ts.map((ti,k) => {
      const t = TRACKS[ti], f = fitOf(t.terr), sel = UI.ticket === k;
      return `<button type="button" class="ticket" data-act="ticket" data-i="${k}" aria-pressed="${sel}">
        <span class="stub">${icon(t.ic,24,"#14202b")}<b>${t.terr}</b><span>${t.len}</span><em>Vigor −${vc}</em></span>
        <span class="tk">${sel ? `<span class="check">${icon("check",16,"#1d1704","3")}</span>` : ""}
          <span class="tn">${t.name}</span>
          <span class="row"><span class="chip" style="background:${f.bg};color:${f.fg}">${f.t}</span><span class="feat">${t.feat}</span></span>
          <span class="bot"><span class="row" style="gap:3px"><span class="k" style="margin-right:3px">Rivales</span><span class="sr">${t.stars} de 3 estrellas</span>${[0,1,2].map(i => star(i < t.stars)).join("")}</span>
          <span class="prize"><span class="k">hasta</span><b>+${t.cap}</b><span class="k">puntos</span></span></span>
        </span></button>`;
    }).join("");
  } else {
    const nx = nextOffers(w);
    const why = isGoal(w) ? "Esta semana se corre la carrera objetivo." : isGoal(w+1) ? "La semana que viene es la carrera objetivo: esta semana no hay opcionales." : "Esta semana no hay carreras opcionales.";
    content = `<div class="panel note"><p style="margin:0 0 6px;font-weight:600">${why}</p><p class="sub">${nx.length ? "Próximas: semana " + nx.join(" y ") + "." : "No quedan más esta temporada."}</p></div>`;
  }
  const t = off && UI.ticket >= 0 ? TRACKS[ticketsFor(w)[UI.ticket]] : null;
  const short = t ? t.name.replace(/^(Copa|Gran Premio|Trofeo|Circuito de las|Clásico del|Regata de los)\s+/, "") : "";
  return `<div class="body">
    <div class="rhead">${chibi(S.runner)}<div><h1 class="title">Carreras opcionales</h1><p class="sub">Pistas nuevas. Correr usa la semana.</p></div></div>
    ${weeksHTML()}
    ${content}
  </div>
  <div class="foot">
    <button type="button" class="btn back" data-act="home">${icon("back",20,"currentColor","2.4")}<span>Volver</span></button>
    ${off ? (t ? `<button type="button" class="btn main" data-act="confirmRace"><b>Correr ${esc(short)}</b><span>Usa la semana · Vigor −${vc}</span></button>`
                : `<button type="button" class="btn main" disabled><b>Elegí una carrera</b></button>`) : ""}
  </div>`;
}

  $("#app").className = "app" + (UI.screen === "menu" ? " home L-" + LAYOUT : "");
  $("#hud").hidden = start;
  $("#hud").innerHTML = start ? "" : hudHTML();
  const f = {start:startHTML, menu:menuHTML, train:trainHTML, races:racesHTML, shop:shopHTML, crew:crewHTML, end:endHTML}[UI.screen];
  $("#screen").innerHTML = f();
  if (focusSel){ const el = document.querySelector(focusSel); if (el) el.focus({preventScroll:false}); }
  if (S) save();
}
function go(screen, focusSel){
  UI.screen = screen; UI.sel = -1; UI.ticket = -1; UI.ask = -1; UI.chip = false; UI.eActs = false; UI.eStats = false;
  render(focusSel || (screen === "menu" ? "#primary" : screen === "start" ? ".pickc" : ".foot .back, #primary"));
  const b = document.querySelector(".body"); if (b) b.scrollTop = 0;
}

/* ===== popups ===== */
const dlg = $("#dlg");
let onClose = null;
function popup(o){
  const rows = o.rows.map(r => `<li>${r.ic ? icon(r.ic,20,"#4b5967") : `<span style="width:20px"></span>`}<span class="n ${r.tone || ""}">${r.n}</span><span class="t">${r.t}${r.s ? `<small>${r.s}</small>` : ""}</span>${r.chip ? `<span class="upchip">${r.chip}</span>` : ""}</li>`).join("");
  const icc = o.kind === "neutral" ? "#1d1704" : "#ffffff";
  const rv = (d) => o.run ? ` class="reveal" style="--d:${d}s"` : "";
  const lead = o.run ? `<span class="hopper" aria-hidden="true">${chibi(S.runner)}</span>` : `<span class="dl-ic ${o.kind}">${icon(o.ic,26,icc,"2.6")}</span>`;
  dlg.innerHTML = `<div class="dl">
    <div class="dl-top">${lead}<div style="min-width:0"><div class="dl-k">${esc(o.k)}</div><h2 id="dlgTitle"${rv(1.1)}>${esc(o.head)}</h2></div></div>
    ${o.why ? `<p class="why">${esc(o.why)}</p>` : ""}
    ${o.verdict ? `<div${rv(1.3)}><div class="verdict ${o.verdict.good ? "good" : "bad"}">${icon(o.verdict.good ? "check" : "warn",20,"currentColor","2.6")}<span>${o.verdict.t}</span></div></div>` : ""}
    <ul class="rows"${rv(1.4)}>${rows}</ul>
    <div class="dl-acts"><button type="button" class="btn main" data-dlg="close"><b>Continuar</b></button></div>
  </div>`;
  openDlg(() => go("menu"));
}
function openDlg(cb){
  onClose = cb;
  save();
  dlg.showModal();
  const b = dlg.querySelector("[data-dlg=close], [data-dlg=first]"); if (b) b.focus();
}
function closeDlg(){
  if (!dlg.open) return;
  dlg.close();
  const cb = onClose; onClose = null;
  if (cb) cb();
}
dlg.addEventListener("cancel", e => { e.preventDefault(); closeDlg(); });
dlg.addEventListener("keydown", e => {
  if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)){ e.preventDefault(); closeDlg(); }
});
dlg.addEventListener("click", e => {
  const b = e.target.closest("[data-dlg]");
  if (e.target === dlg){ closeDlg(); return; }
  if (!b) return;
  const a = b.dataset.dlg;
  if (a === "close") closeDlg();
  else if (a === "askReset"){ UI.menuConfirm = true; menuDlg(true); }
  else if (a === "cancelReset"){ UI.menuConfirm = false; menuDlg(false); }
  else if (a === "doReset"){ onClose = null; dlg.close(); restart(); }
  else if (a === "btnv"){ const v = b.dataset.v; setBtn(v); if (S && UI.screen === "menu") render(); menuDlg(false); const f = dlg.querySelector(`[data-dlg=btnv][data-v="${v}"]`); if (f) f.focus(); }
  else if (a === "fallo"){ const v = b.dataset.v; setFalV(v); if (S && UI.screen === "train") render(); menuDlg(false); const f = dlg.querySelector(`[data-dlg=fallo][data-v="${v}"]`); if (f) f.focus(); }
  else if (a === "crewv"){ const v = b.dataset.v; setCrewV(v); if (S && UI.screen === "train") render(); menuDlg(false); const f = dlg.querySelector(`[data-dlg=crewv][data-v="${v}"]`); if (f) f.focus(); }
  else if (a === "layout"){ const l = b.dataset.l; setLayout(l); if (S && UI.screen === "menu") render(); menuDlg(false); const f = dlg.querySelector(`[data-dlg=layout][data-l="${l}"]`); if (f) f.focus(); }
});
function menuDlg(confirm){
  dlg.innerHTML = confirm ? `<div class="dl">
      <div class="dl-top"><span class="dl-ic bad">${icon("restart",26,"#ffffff","2.6")}</span><div><div class="dl-k">Menú</div><h2 id="dlgTitle">¿Reiniciar?</h2></div></div>
      <p class="why">Se pierde esta temporada y volvés a elegir corredora.</p>
      <div class="dl-acts"><button type="button" class="btn" data-dlg="cancelReset" data-first>Cancelar</button><button type="button" class="btn main" data-dlg="doReset"><b>Reiniciar</b></button></div></div>`
    : `<div class="dl">
      <div class="dl-top"><span class="dl-ic neutral">${icon("menu",26,"#1d1704","2.6")}</span><div><div class="dl-k">Temporada de prueba</div><h2 id="dlgTitle">Menú</h2></div></div>
      <p class="why">Prototipo: los números son de mentira, el recorrido es el real.</p>
      <div><div class="dl-k" id="lsegk">Diseño del menú · ${LAYNAME[LAYOUT]}</div><div class="lseg" role="group" aria-labelledby="lsegk" style="margin-top:6px">${LAYS.map(l => `<button type="button" data-dlg="layout" data-l="${l}" aria-pressed="${l === LAYOUT}" aria-label="Diseño ${l}: ${LAYNAME[l]}">${l}</button>`).join("")}</div></div>
      <div><div class="dl-k" id="csegk">Cuadrilla en Entrenar · ${CVNAME[CREWV]}</div><div class="lseg" role="group" aria-labelledby="csegk" style="margin-top:6px">${CVS.map(v => `<button type="button" data-dlg="crewv" data-v="${v}" aria-pressed="${v === CREWV}" aria-label="Cuadrilla ${v}: ${CVNAME[v]}">${v}</button>`).join("")}</div></div>
      <div><div class="dl-k" id="fsegk">Fallo · ${FVNAME[FALV]}</div><div class="lseg" role="group" aria-labelledby="fsegk" style="margin-top:6px">${FVS.map(v => `<button type="button" data-dlg="fallo" data-v="${v}" aria-pressed="${v === FALV}" aria-label="Fallo ${v}: ${FVNAME[v]}">${v}</button>`).join("")}</div></div>
      ${LAYOUT === "D" ? `<div><div class="dl-k" id="bsegk">Botón Entrenar · ${BTNNAME[BTNV]}</div><div class="lseg b7" role="group" aria-labelledby="bsegk" style="margin-top:6px">${BTNS.map(v => `<button type="button" data-dlg="btnv" data-v="${v}" aria-pressed="${v === BTNV}" aria-label="Botón ${v}: ${BTNNAME[v]}">${v}</button>`).join("")}</div></div>` : ""}
      <div class="menu-list"><button type="button" class="btn" data-dlg="askReset">${icon("restart",20)}<span>Reiniciar temporada</span></button>
      <button type="button" class="btn" data-dlg="close">${icon("x",20)}<span>Cerrar</span></button></div>
      <p class="aitag">Arte provisional generado con IA</p></div>`;
  if (!dlg.open){ onClose = () => { if (S) render("[data-act=menu]"); }; dlg.showModal(); }
  const f = dlg.querySelector(confirm ? "[data-dlg=cancelReset]" : "[data-dlg=askReset]"); if (f) f.focus();
}
function restart(){
  try { localStorage.removeItem(SAVE); } catch(e){}
  S = null; UI.pick = -1; go("start");
}
let toastT = 0;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }

/* ===== clics ===== */
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act, i = Number(b.dataset.i);
  switch (a){
    case "train": go("train"); break;
    case "home": go("menu"); break;
    case "rest": doRest(); break;
    case "outing": doOuting(); break;
    case "races": go("races"); break;
    case "shop": go("shop"); break;
    case "crew": go("crew"); break;
    case "menu": UI.menuConfirm = false; menuDlg(false); break;
    case "chip": UI.chip = true; render(`[data-act=layout][data-l="${LAYOUT}"]`); break;
    case "layout": setLayout(b.dataset.l); render("[data-act=chip]"); break;
    case "btnv": setBtn(b.dataset.v); render(`[data-act=btnv][data-v="${BTNV}"]`); break;
    case "eActs": UI.eActs = !UI.eActs; render(UI.eActs ? "#primary" : "[data-act=eActs]"); break;
    case "eStats": UI.eStats = !UI.eStats; render("[data-act=eStats]"); break;
    case "goal": doGoal(); break;
    case "restart": restart(); break;
    case "pickRunner": UI.pick = i; render(`[data-act=pickRunner][data-i="${i}"]`); break;
    case "begin": if (UI.pick >= 0){ S = fresh(RUN_IDS[UI.pick]); save(); go("menu"); toast(`Temporada de ${RUN().name}`); } break;
    case "pick":
      if (UI.sel === i){ doTrain(i); }
      else { UI.sel = i; render(`[data-act=pick][data-i="${i}"]`); }
      break;
    case "fv": setFalV(FVS[(FVS.indexOf(FALV) + 1) % FVS.length]); render("[data-act=fv]"); break;
    case "cv": setCrewV(CVS[(CVS.indexOf(CREWV) + 1) % CVS.length]); render("[data-act=cv]"); break;
    case "confirmTrain": if (UI.sel >= 0) doTrain(UI.sel); break;
    case "ticket": UI.ticket = UI.ticket === i ? -1 : i; render(`[data-act=ticket][data-i="${i}"]`); break;
    case "confirmRace": if (UI.ticket >= 0) doRace(ticketsFor(S.week)[UI.ticket]); break;
    case "wing":
      if (S.wings !== i){ S.wings = i; UI.ask = -1; render(`[data-act=wing][data-i="${i}"]`); toast(`Puso las ${WINGS_OF()[i].name}`); }
      break;
    case "repair": {
      const c = repairCost();
      if (S.scrap >= c){ S.scrap -= c; S.dur[S.wings] = 100; render(".foot .back"); toast("Alas reparadas"); }
      break;
    }
    case "learn":
      if (UI.ask === i){
        if (S.pts >= SKILLS[i].cost && !S.skills.includes(i)){ S.pts -= SKILLS[i].cost; S.skills.push(i); toast(`Aprendió ${SKILLS[i].name}`); }
        UI.ask = -1; render(".foot .back");
      } else { UI.ask = i; render(`[data-act=learn][data-i="${i}"]`); }
      break;
  }
});

/* ===== arranque ===== */
S = load();
go(!S ? "start" : S.over ? "end" : "menu", "none");
</script>
