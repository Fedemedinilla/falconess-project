# Verify every push to main and every pull request (ROADMAP D2, D13; docs/race-engine.md 22, 24.4).
#
# - verify: lint, typecheck (sources and tests), the whole test suite (the golden logs of
#   tests/golden/v1 and the determinism checks included: packages/sim/src/race/golden.test.ts) and
#   the content validation.
# - bench: `pnpm bench` in its own job, so timing noise never hides the verify results. The bench
#   writes the ms per race to the job summary and fails only on its own gate: the canyon
#   p95 over 5 ms (packages/sim/bench/race.bench.ts).
# - batch-smoke: the CI smoke of docs/race-engine.md 24.4, 1000 mixed races of the real batch in
#   under 6 s (`--max-wall-ms 6000`; it also fails on any DNF). It times the harness the bench
#   does not: workers, cached geometry and arena, the seasons of S7.
# - e2e: the tester page in Chromium (apps/web/e2e, `pnpm --filter @falconess/web test:e2e`): three
#   seasons played by clicks with their T12 replays, copy and load, the free race, and the
#   published single-file page wrapped like the host does. Any console error fails it. Traces and
#   screenshots of a failure, and the season timings, are uploaded.
# - barandas-quick: `pnpm balance:barandas -- --quick` (ADR-0010, ADR-0011): the eight guardrails
#   of race v3 on small samples. A gate on B8 (v1, v2 and every v3 switch off move 0 bytes, the
#   goldens hold) and on the harness itself (a guardrail with no data fails); B1-B7 on these
#   samples are a smoke test, not a verdict. The full run (`pnpm balance:barandas`, ≈ 30-40 min)
#   is the requirement of any balance change and goes with its PR (docs/commands.md).
# - The 10 000-race balance batch lives in balance.yml (report only, 60-s budget).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:validate

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # writes its table to $GITHUB_STEP_SUMMARY before checking the p95 gate
      - run: pnpm bench

  batch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim:batch -- --runs 1000 --report out/smoke.json --max-wall-ms 6000

  barandas-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm balance:barandas -- --quick --label ci
      - if: always()
        run: cat out/barandas/barandas-ci-quick.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barandas-quick
          path: out/barandas/barandas-ci-quick.*
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @falconess/web exec playwright install --with-deps chromium
      - run: pnpm --filter @falconess/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .work/ui/e2e-results
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-season-timing
          path: .work/ui/timing
          retention-days: 14
          if-no-files-found: ignore
