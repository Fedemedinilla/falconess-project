# Balance batch (BRIEF §12, docs/race-engine.md §25.2.1, docs/balance-batch.md).
#
# - Pull requests that touch an input of the metrics (sim, content, rng, schema, the batch, the
#   S7 reference policy) run the `pr` profile (10 000 races), diff it against the latest
#   `balance-pr` artifact of main (the diff header names its run and commit) and post the Markdown
#   as one sticky PR comment (found by its `<!-- falconess-balance-report -->` marker) and as the
#   job summary.
# - Pushes to main run the same batch and upload `balance-pr`: that artifact is the baseline. A
#   push run never fails on a verdict: main produces the baseline, whatever it measures.
# - The nightly schedule (and a manual dispatch with profile=full) runs the `full` profile and
#   uploads `balance-full`.
# - Report only: metric verdicts never fail the job. Set the repository variable
#   BALANCE_GATE=enforce to apply §25.2.1's blocking rule on pull requests once the D14 balance
#   pass lands: a fail in the PR's report fails the job, and so does a fail cell of the last
#   `balance-full` of main that the PR's report neither passes nor re-targets (sim:batch
#   --gate-report). A PR that attaches an ADR moving a target (BRIEF §12), or a fix the `pr`
#   sample cannot show, carries the label `balance-adr`: the job then reports without failing on
#   verdicts, and the reviewer checks the ADR.
# - Any DNF exits 1 and fails the job: it is an engine bug (§19), not balance. So does a wall
#   time of 60 s or more (docs/race-engine.md 24.4; the 1000-race smoke is in ci.yml).
name: balance

on:
  pull_request:
    # labeled / unlabeled: adding or removing `balance-adr` re-runs the job
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # the inputs of the metrics; keep the push list the same
    paths:
      - "packages/sim/**"
      - "packages/content/**"
      - "packages/rng/**"
      - "packages/schema/src/**"
      - "apps/cli/src/sim-batch.ts"
      - "apps/cli/src/batch/**"
      - "apps/cli/src/policy.ts"
      - "apps/cli/src/goal-rate.ts"
      - ".github/workflows/balance.yml"
  push:
    branches: [main]
    paths:
      - "packages/sim/**"
      - "packages/content/**"
      - "packages/rng/**"
      - "packages/schema/src/**"
      - "apps/cli/src/sim-batch.ts"
      - "apps/cli/src/batch/**"
      - "apps/cli/src/policy.ts"
      - "apps/cli/src/goal-rate.ts"
      - ".github/workflows/balance.yml"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "pr (10 000 races, uploads balance-pr) or full (nightly sample sizes, uploads balance-full)"
        type: choice
        options: [pr, full]
        default: full

permissions:
  contents: read

concurrency:
  group: balance-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-batch:
    name: sim:batch (pr profile)
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'pr')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # download artifacts of earlier runs on main
      pull-requests: write # sticky PR comment
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The newest finished run on main that holds the artifact, whatever its conclusion (a run
      # can fail on a DNF or the time budget after uploading its report): the newest measurement
      # of main is the baseline. Its run and commit go to the diff header.
      - name: Fetch the baseline and the last full report of main
        id: fetch
        if: github.event_name == 'pull_request'
        run: |
          download() {
            local name="$1" dir="$2" key="$3" id sha
            mkdir -p "$dir"
            while read -r id sha; do
              if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$dir" 2>/dev/null; then
                echo "$name: run $id, commit $sha"
                echo "$key=run $id (commit ${sha:0:10})" >> "$GITHUB_OUTPUT"
                return 0
              fi
            done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow balance.yml --branch main \
                --status completed --limit 30 --json databaseId,headSha \
                --jq '.[] | "\(.databaseId) \(.headSha)"')
            echo "$name: none on main yet"
          }
          download balance-pr out/baseline baseline
          download balance-full out/full full

      # §25.2.1 gate, pull requests only: main produces the baseline and never fails on a verdict.
      # The label `balance-adr` (an ADR that moves a target, BRIEF §12) reports without the gate.
      - name: Run the balance batch
        id: batch
        env:
          BALANCE_GATE: ${{ vars.BALANCE_GATE }}
          EVENT: ${{ github.event_name }}
          ADR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'balance-adr') }}
          BASELINE_FROM: ${{ steps.fetch.outputs.baseline }}
        run: |
          args=(--runs 10000 --report out/balance.json --markdown out/balance.md --max-wall-ms 60000)
          if [ -f out/baseline/balance.json ]; then
            args+=(--baseline out/baseline/balance.json)
            if [ -n "$BASELINE_FROM" ]; then args+=(--baseline-from "$BASELINE_FROM"); fi
          fi
          if [ "$BALANCE_GATE" = "enforce" ] && [ "$EVENT" = "pull_request" ]; then
            if [ "$ADR_LABEL" = "true" ]; then
              echo "label balance-adr: verdicts and the gate report do not fail this job"
            else
              args+=(--fail-on-verdict)
              if [ -f out/full/balance.json ]; then args+=(--gate-report out/full/balance.json); fi
            fi
          fi
          pnpm sim:batch -- "${args[@]}"

      - name: Job summary
        if: always() && hashFiles('out/balance.md') != ''
        run: cat out/balance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        if: >-
          always() && github.event_name == 'pull_request' && hashFiles('out/balance.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- falconess-balance-report -->'
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@out/balance.md > /dev/null
            echo "updated comment $id"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file out/balance.md
          fi

      - name: Upload the report
        if: always() && hashFiles('out/balance.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balance-pr
          path: |
            out/balance.json
            out/balance.md
          retention-days: 90

  full-batch:
    name: sim:batch (full profile)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run the full balance batch
        run: pnpm sim:batch -- --profile full --report out/balance.json --markdown out/balance.md

      - name: Job summary
        if: always() && hashFiles('out/balance.md') != ''
        run: cat out/balance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always() && hashFiles('out/balance.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: balance-full
          path: |
            out/balance.json
            out/balance.md
          retention-days: 90
